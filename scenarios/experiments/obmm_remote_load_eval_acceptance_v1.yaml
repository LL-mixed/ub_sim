schema: 1
name: obmm-remote-load-eval-acceptance-v1
minimums:
  scalar_operations: 30000
  range_bytes: 1073741824
  duration_ms: 2000
  warmup_scalar_operations: 1000
  warmup_range_pages: 64
  formal_seed_count: 7
  host_noise_threshold_milli: 250
factors:
  model_latency_us: [1]
  jitter_profiles: [none]
  outcomes: [success]
  coroutines: [4]
  inflight: [8]
  lookahead: [4]
  compute_us: [0, 100]
  patterns: [sequential]
cases:
  - id: S0-sync
    band: scalar
    mode: sync-mmio
    access_bytes: 8
    issue: demand
    lookahead: 0
    extra_vcpus: 0
  - id: S1-submit-await-demand
    band: scalar
    mode: async-poll
    access_bytes: 8
    issue: demand
    lookahead: 0
    extra_vcpus: 0
  - id: S2-submit-await-lookahead
    band: scalar
    mode: async-poll
    access_bytes: 8
    issue: lookahead
    sweep_lookahead: true
    extra_vcpus: 0
  - id: S3-async-load-demand
    band: scalar
    mode: async-load
    access_bytes: 8
    issue: demand
    lookahead: 0
    extra_vcpus: 0
  - id: R0-sync-range
    band: range
    mode: sync-mmio
    access_bytes: 4096
    issue: demand
    lookahead: 0
    extra_vcpus: 0
  - id: R1-submit-await-range
    band: range
    mode: async-poll
    access_bytes: 4096
    issue: lookahead
    sweep_lookahead: true
    extra_vcpus: 0
  - id: R2-userfaultfd
    band: range
    mode: userfaultfd
    access_bytes: 4096
    issue: fault
    lookahead: 0
    extra_vcpus: 1
sweeps:
  - id: scalar-acceptance
    cases: [S0-sync, S1-submit-await-demand, S2-submit-await-lookahead, S3-async-load-demand]
    model_latency_us: [1]
    jitter_profiles: [none]
    outcomes: [success]
    coroutines: [4]
    inflight: [8]
    lookahead: [4]
    compute_us: [100]
    patterns: [sequential]
  - id: range-acceptance
    cases: [R0-sync-range, R1-submit-await-range, R2-userfaultfd]
    model_latency_us: [1]
    jitter_profiles: [none]
    outcomes: [success]
    coroutines: [4]
    inflight: [8]
    lookahead: [4]
    compute_us: [0]
    patterns: [sequential]
