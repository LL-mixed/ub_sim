scenario:
  name: mvp_8host_single_domain
  group: M
  variant: m_8host_single_domain_mvp
  seed: 42
  duration_us: 1000000
  logical_system: llm-serving-mvp

platform:
  backend: qemu
  machine_profile: ub-host-minimal
  cpu_model: host
  memory_model: numa-sim
  device_model_mode: mixed

remote_memory_model:
  enabled: true
  time_source: qemu_virtual
  fixed_latency_ns: 100000
  jitter:
    mode: uniform
    max_abs_ns: 20000
  tail:
    probability_ppm: 0
    extra_latency_ns: 0
  queue_depth: 64
  reorder_window: 8
  drop_ppm: 0
  error_ppm: 0
  duplicate_ppm: 0
  duplicate_delay_ns: 1000
  seed: 1

async_load_model:
  enabled: true
  context_entries: 64
  pending_load_entries: 64
  event_queue_depth: 128
  clock_mhz: 2000

topology:
  hosts: 8
  ubpus_per_host: 1
  entities_per_ubpu: 2
  ub_domains:
    - id: domain0
      hosts: [0, 1, 2, 3, 4, 5, 6, 7]
  collapse:
    fabric: true
    global: true

ub_runtime:
  active_levels: [2, 3, 4]
  reserved_levels: [0, 1, 5, 6, 7]
  preserve_full_task_coord: true

pypto:
  enable_function_labels: true
  default_level: HOST
  allow_levels: [CHIP, HOST, CLUSTER_0]
  simpler_boundary:
    enabled: true
    chip_backend_mode: stub
    dispatch_latency_us: 15
  scope_runtime:
    enable_multi_layer_ring: true
    enable_pl_free: true
    max_scope_depth: 8

lingqu_data:
  shmem:
    enabled: true
    pe_count: 8
    default_latency_us: 3
  block:
    enabled: true
    devices:
      - uba: ssu0
        blocks: 1048576
        block_size: 4096
  dfs:
    enabled: true
    namespace_root: /
    metadata_latency_us: 20
    data_latency_us: 80
  db:
    enabled: true
    inline_value_limit: 64
    pipeline_batch_limit: 16

levels:
  l2_ubpu_tier:
    capacity_blocks: 1024
    high_watermark: 0.9
    low_watermark: 0.7
    hit_latency_us: 5
  l3_host_tier:
    capacity_blocks: 8192
    high_watermark: 0.9
    low_watermark: 0.7
    fetch_latency_us: 30
  l4_domain_tier:
    capacity_blocks: 65536
    high_watermark: 0.95
    low_watermark: 0.8
    fetch_latency_us: 80

routing:
  mode: recursive
  hit_weight: 10.0
  load_weight: 2.0
  capacity_weight: 1.0

workload:
  type: rust_llm_server_mvp
  profile: single_domain_basic
  qps: 2000
  unique_prefixes: 256
  blocks_per_request: 4
  function_label_mode: host_orchestration

faults:
  - type: host_degraded
    at_us: 300000
    host_id: 0

outputs:
  trace: true
  metrics_csv: true
  summary_json: true
  emit_task_coord_trace: true
  emit_data_service_trace: true
  emit_qemu_platform_trace: true
