# linqu mem_service prometheus alert rules
# contract_version: 1
groups:
- name: lingqu_mem_service.rules
  rules:
  - alert: LingquMemServiceDown
    expr: up{job="linqu_mem_service"} == 0
    for: 1m
    labels:
      severity: critical
      service: linqu_mem_service
    annotations:
      summary: linqu_mem_service scrape target is down
      runbook: check service manager, socket path, and metrics listener
  - alert: LingquMemServiceErrorRate
    expr: increase(lingqu_mem_service_error_count[5m]) > 0
    for: 5m
    labels:
      severity: warning
      service: linqu_mem_service
    annotations:
      summary: mem_service returned non-ok RPC statuses
      runbook: inspect audit-log and recent client errors
  - alert: LingquMemServiceFailClosed
    expr: increase(lingqu_mem_service_fail_closed_count[5m]) > 0
    for: 1m
    labels:
      severity: critical
      service: linqu_mem_service
    annotations:
      summary: mem_service fail-closed path is active
      runbook: check stale_ref, checksum_mismatch, and binding counters
  - alert: LingquMemServiceChecksumMismatch
    expr: increase(lingqu_mem_service_checksum_mismatch_count[5m]) > 0
    for: 1m
    labels:
      severity: critical
      service: linqu_mem_service
    annotations:
      summary: mem_service detected a corrupt payload or ref
      runbook: quarantine corrupt block and verify producer checksums
  - alert: LingquMemServiceHighLatency
    expr: lingqu_mem_service_request_latency_max_ms > 100
    for: 5m
    labels:
      severity: warning
      service: linqu_mem_service
    annotations:
      summary: mem_service max request latency exceeded 100 ms
      runbook: inspect storage backend, socket backlog, and client retry load
