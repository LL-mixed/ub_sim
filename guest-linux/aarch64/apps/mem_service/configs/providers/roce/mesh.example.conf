# RoCE provider deployment example. Copy outside the repository and replace
# the documentation addresses, device, socket, and durable paths.
version=1
listen=unix:/run/lingqu/mem_service-roce.sock
store=/var/lib/lingqu/mem_service-roce/store.snapshot
storage_root=/var/lib/lingqu/mem_service-roce
metrics_listen=tcp:127.0.0.1:9910
verify_bytes=65536
verify_iterations=1
timeout_ms=30000
endpoint=server,192.0.2.10,192.0.2.11,19110,rocep1s0f0
endpoint=client,198.51.100.10,198.51.100.11,19111,rocep1s0f1
