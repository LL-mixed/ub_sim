listen=unix:/run/lingqu/mem_service_host.sock
store=/var/lib/lingqu/mem_service_host/store.snapshot
node_id=local-node-host-0
cluster_id=local-cluster
storage_root=/var/lib/lingqu/mem_service_host
backend=snapshot+journal
max_records=1024
max_payload_bytes=4096
retention=manual
checkpoint_retention=manual
encryption=none
auth_mode=none
metrics_mode=text-kv
metrics_listen=tcp:127.0.0.1:9901
adapter_enablement=core
