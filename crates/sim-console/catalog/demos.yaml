  - id: w5-qwen-2
    title: W5 Qwen PP / 2 Nodes
    category: W5 Inference
    summary: Run Qwen streaming decode through a two-stage W5 pipeline.
    node_count: 2
    topology: pipeline
    model: Qwen3
    model_source: qwen3-0.6b
    data_plane: [Memory Service, GSVA, KV Cache]
    tags: [stream-infer, pipeline-parallel]
    estimated_duration_secs: 300
    command:
      program: guest-linux/aarch64/scripts/run_w5_cluster_config.sh
      args: [--nodes, "2", --steps, "{steps}", --gsva-kv, w5.macos.env]
      environment: { RUN_ID: "{run_id}", SIM_W5_ALLOW_FIXED_RUN_ID: "1" }
    parameters: &w5_steps
      - id: steps
        label: Decode steps
        kind: integer
        default: "2"
        min: 1
        max: 64
    requirements: [QEMU, guest artifacts, Qwen weights referenced by config]
    required_paths:
      - guest-linux/aarch64/scripts/run_w5_cluster_config.sh
      - w5.macos.env
    controls: [stop, node_logs]

