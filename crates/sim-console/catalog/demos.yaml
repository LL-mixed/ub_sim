version: 1
demos:
  - id: obmm-pool-2
    title: OBMM Pool / 2 Nodes
    category: OBMM
    summary: Export, import, and exercise a shared OBMM memory pool.
    node_count: 2
    topology: pair
    data_plane: [OBMM, GVA]
    tags: [memory-pool, coherence]
    estimated_duration_secs: 180
    command:
      program: guest-linux/aarch64/scripts/run_ub_dual_node_obmm_pool.sh
      environment: { RUN_ID: "{run_id}" }
    requirements: [QEMU, guest kernel, initramfs]
    required_paths: [guest-linux/aarch64/scripts/run_ub_dual_node_obmm_pool.sh]
    controls: [stop, node_logs]

  - id: obmm-pool-4
    title: OBMM Pool / 4 Nodes
