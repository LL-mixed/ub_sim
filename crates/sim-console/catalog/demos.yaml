      environment: { RUN_ID: "{run_id}" }
    requirements: [QEMU, guest kernel, initramfs, 32 GiB host memory]
    required_paths: [guest-linux/aarch64/scripts/run_ub_four_node_obmm_pool.sh]
    controls: [stop, node_logs]

