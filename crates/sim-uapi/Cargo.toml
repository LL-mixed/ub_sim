[package]
name = "sim-uapi"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "deepseek-v4-flash-simpler"
path = "src/bin/deepseek_v4_flash_simpler.rs"

[dependencies]
libc = "0.2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sim-config = { path = "../sim-config" }
sim-core = { path = "../sim-core" }
sim-memory = { path = "../sim-memory" }
sim-models = { path = "../sim-models" }
sim-runtime = { path = "../sim-runtime" }
sim-services = { path = "../sim-services" }
sim-topology = { path = "../sim-topology" }
