<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="760" viewBox="0 0 1480 760" role="img" aria-labelledby="title desc">
  <title id="title">P0 延迟注入点与三种时钟</title>
  <desc id="desc">展示远端读从校验、provider accept、延迟模型到 completion publish 的路径，以及 model、guest、host 三种不可混用的测量时钟。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 650 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .body { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; }
      .box { stroke: #94a3b8; stroke-width: 1.5; }
      .flow { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .measure { stroke: #64748b; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="1480" height="760" fill="#f8fafc"/>
  <text x="64" y="58" class="title">P0：延迟只注入一次，三种时钟分别回答不同问题</text>
  <text x="64" y="88" class="subtitle">validation 错误立即返回；accepted remote request 才进入 virtual-time model</text>

  <rect x="64" y="132" width="230" height="104" class="box" fill="#e2e8f0"/>
  <text x="179" y="169" text-anchor="middle" class="label">OBMM validation</text>
  <text x="179" y="197" text-anchor="middle" class="body">map / token / epoch</text>
  <text x="179" y="220" text-anchor="middle" class="body">bounds / permission / coherence</text>

  <rect x="352" y="132" width="220" height="104" class="box" fill="#dbeafe"/>
  <text x="462" y="169" text-anchor="middle" class="label">Provider accept</text>
  <text x="462" y="197" text-anchor="middle" class="body">operation_key</text>
  <text x="462" y="220" text-anchor="middle" class="body">payload / real status</text>

  <rect x="630" y="118" width="360" height="132" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="810" y="154" text-anchor="middle" class="label">P0 virtual-time model</text>
  <text x="810" y="184" text-anchor="middle" class="body">fixed + jitter + tail</text>
  <text x="810" y="208" text-anchor="middle" class="body">queue / reorder / drop / error / duplicate</text>
  <text x="810" y="232" text-anchor="middle" class="small">due = f(operation_key, model_seed)</text>

  <rect x="1048" y="132" width="240" height="104" class="box" fill="#dcfce7"/>
  <text x="1168" y="169" text-anchor="middle" class="label">Completion publish</text>
  <text x="1168" y="197" text-anchor="middle" class="body">P1 / sync consumer</text>
  <text x="1168" y="220" text-anchor="middle" class="body">status + payload</text>

  <path d="M294 184 H344" class="flow"/>
  <path d="M572 184 H622" class="flow"/>
  <path d="M990 184 H1040" class="flow"/>
  <path d="M179 245 V290 H462 V245" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="320" y="315" text-anchor="middle" class="body" fill="#991b1b">validation failure：不注入延迟，返回真实错误</text>

  <text x="64" y="382" class="label">测量边界</text>

  <rect x="64" y="414" width="1352" height="72" class="box" fill="#eff6ff"/>
  <text x="92" y="444" class="label">Model virtual ns</text>
  <line x1="352" y1="451" x2="1288" y2="451" class="measure"/>
  <circle cx="462" cy="451" r="6" fill="#2563eb"/>
  <circle cx="1168" cy="451" r="6" fill="#2563eb"/>
  <text x="462" y="475" text-anchor="middle" class="small">accept</text>
  <text x="1168" y="475" text-anchor="middle" class="small">publish</text>
  <text x="1326" y="457" class="body">模型是否按配置实现</text>

  <rect x="64" y="506" width="1352" height="72" class="box" fill="#f0fdf4"/>
  <text x="92" y="536" class="label">Guest MONOTONIC_RAW</text>
  <line x1="352" y1="543" x2="1288" y2="543" class="measure"/>
  <circle cx="390" cy="543" r="6" fill="#16a34a"/>
  <circle cx="1228" cy="543" r="6" fill="#16a34a"/>
  <text x="390" y="567" text-anchor="middle" class="small">before submit/load</text>
  <text x="1228" y="567" text-anchor="middle" class="small">result consumable</text>
  <text x="1326" y="549" class="body">应用观察延迟</text>

  <rect x="64" y="598" width="1352" height="72" class="box" fill="#fff7ed"/>
  <text x="92" y="628" class="label">Host monotonic</text>
  <line x1="352" y1="635" x2="1288" y2="635" class="measure"/>
  <circle cx="370" cy="635" r="6" fill="#ea580c"/>
  <circle cx="1260" cy="635" r="6" fill="#ea580c"/>
  <text x="370" y="659" text-anchor="middle" class="small">launcher/QEMU start</text>
  <text x="1260" y="659" text-anchor="middle" class="small">host trace end</text>
  <text x="1326" y="641" class="body">发现 host 噪声</text>

  <rect x="64" y="696" width="1352" height="42" rx="9" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="740" y="723" text-anchor="middle" class="label">禁止把三者合成一个 latency_us，也禁止用 host sleep 模拟 service time</text>
</svg>
