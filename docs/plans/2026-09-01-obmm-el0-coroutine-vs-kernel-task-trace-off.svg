<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120"
     viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">OBMM direct-EL0 coroutine and Linux-task trace-off comparison</title>
  <desc id="desc">The upper half compares the direct EL0 event-ring coroutine path with the ESR EL1, Linux scheduler, CQ and IRQ path. The lower half plots kernel-task divided by direct-EL0 makespan for five modeled remote latencies and lists P99 ratios.</desc>
  <defs>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #102a43; }
      .subtitle { font: 400 18px Inter, Arial, sans-serif; fill: #486581; }
      .section { font: 700 22px Inter, Arial, sans-serif; fill: #102a43; }
      .card-title { font: 700 19px Inter, Arial, sans-serif; fill: #102a43; }
      .body { font: 400 16px Inter, Arial, sans-serif; fill: #243b53; }
      .small { font: 400 14px Inter, Arial, sans-serif; fill: #486581; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #102a43; }
      .axis { font: 500 14px Inter, Arial, sans-serif; fill: #486581; }
      .value { font: 700 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #102a43; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#526d82"/>
    </marker>
  </defs>

  <rect width="1600" height="1120" fill="#f7fafc"/>
  <rect x="36" y="30" width="1528" height="82" rx="18" fill="#eaf2f8" stroke="#9fb3c8"/>
  <text x="68" y="70" class="title">OBMM remote load · trace-off scheduler comparison</text>
  <text x="68" y="98" class="subtitle">相同普通 LDR、相同 PLT replay、4 contexts × 64 operations；差异集中在 delivery 与 scheduling owner</text>

  <text x="48" y="150" class="section">1 · 数据路径</text>

  <rect x="48" y="172" width="720" height="242" rx="18" fill="#e8f4ff" stroke="#2f80b7" stroke-width="2"/>
  <text x="76" y="208" class="card-title">direct-EL0 coroutine</text>
  <text x="76" y="234" class="small">event ring + direct EL0 upcall + EL0 context owner</text>
  <rect x="76" y="258" width="132" height="62" rx="11" fill="#d7ecfb" stroke="#5b9bc4"/>
  <text x="142" y="283" text-anchor="middle" class="body">remote LDR</text>
  <text x="142" y="305" text-anchor="middle" class="small">PENDING</text>
  <line x1="208" y1="289" x2="257" y2="289" stroke="#526d82" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="268" y="258" width="150" height="62" rx="11" fill="#d7ecfb" stroke="#5b9bc4"/>
  <text x="343" y="283" text-anchor="middle" class="body">EL0 upcall</text>
  <text x="343" y="305" text-anchor="middle" class="small">save context</text>
  <line x1="418" y1="289" x2="467" y2="289" stroke="#526d82" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="478" y="258" width="154" height="62" rx="11" fill="#d7ecfb" stroke="#5b9bc4"/>
  <text x="555" y="283" text-anchor="middle" class="body">EL0 scheduler</text>
  <text x="555" y="305" text-anchor="middle" class="small">select coroutine</text>
  <line x1="632" y1="289" x2="681" y2="289" stroke="#526d82" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="692" y="258" width="48" height="62" rx="11" fill="#d7ecfb" stroke="#5b9bc4"/>
  <text x="716" y="296" text-anchor="middle" class="mono">B</text>
  <text x="76" y="352" class="body">COMPLETE → event ring → next EL0 boundary → target READY → original LDR replay</text>
  <text x="76" y="382" class="small">计时内保留 mechanism counters；scheduler trace callback 为 NULL</text>

  <rect x="832" y="172" width="720" height="242" rx="18" fill="#fff3df" stroke="#d9822b" stroke-width="2"/>
  <text x="860" y="208" class="card-title">Linux task</text>
  <text x="860" y="234" class="small">ESR_EL1 + driver waitqueue + CQ/IRQ + Linux scheduler</text>
  <rect x="860" y="258" width="132" height="62" rx="11" fill="#ffead1" stroke="#d89b55"/>
  <text x="926" y="283" text-anchor="middle" class="body">remote LDR</text>
  <text x="926" y="305" text-anchor="middle" class="small">Data Abort</text>
  <line x1="992" y1="289" x2="1041" y2="289" stroke="#526d82" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1052" y="258" width="150" height="62" rx="11" fill="#ffead1" stroke="#d89b55"/>
  <text x="1127" y="283" text-anchor="middle" class="body">EL1 driver</text>
  <text x="1127" y="305" text-anchor="middle" class="small">waitqueue sleep</text>
  <line x1="1202" y1="289" x2="1251" y2="289" stroke="#526d82" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1262" y="258" width="154" height="62" rx="11" fill="#ffead1" stroke="#d89b55"/>
  <text x="1339" y="283" text-anchor="middle" class="body">Linux scheduler</text>
  <text x="1339" y="305" text-anchor="middle" class="small">select pthread</text>
  <line x1="1416" y1="289" x2="1465" y2="289" stroke="#526d82" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1476" y="258" width="48" height="62" rx="11" fill="#ffead1" stroke="#d89b55"/>
  <text x="1500" y="296" text-anchor="middle" class="mono">B</text>
  <text x="860" y="352" class="body">COMPLETE → CQ → IRQ → driver wake → ERET → original LDR replay</text>
  <text x="860" y="382" class="small">计时内保留 mechanism counters；driver per-event dev_info 关闭</text>

  <rect x="48" y="434" width="1504" height="64" rx="14" fill="#eef2f6" stroke="#9fb3c8"/>
  <text x="72" y="461" class="card-title">Trace-off gate</text>
  <text x="244" y="461" class="body">无 event formatting · 无 event buffering · 无 event output · trace_sample_ppm=0</text>
  <text x="72" y="486" class="small">保留：256 latency slots、per-context values、checksum、512 ring events、256 replay consumes、artifact fingerprints、cleanup</text>

  <text x="48" y="542" class="section">2 · K/E makespan ratio（Linux task ÷ direct EL0；低于 1 时 Linux task 较快）</text>

  <rect x="48" y="566" width="1504" height="356" rx="18" fill="#ffffff" stroke="#bcccdc"/>
  <line x1="430" y1="610" x2="1250" y2="610" stroke="#9fb3c8" stroke-width="2"/>
  <line x1="430" y1="604" x2="430" y2="616" stroke="#627d98"/>
  <line x1="664" y1="596" x2="664" y2="893" stroke="#334e68" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="899" y1="604" x2="899" y2="616" stroke="#627d98"/>
  <line x1="1133" y1="604" x2="1133" y2="616" stroke="#627d98"/>
  <line x1="1250" y1="604" x2="1250" y2="616" stroke="#627d98"/>
  <text x="430" y="596" text-anchor="middle" class="axis">0.8</text>
  <text x="664" y="582" text-anchor="middle" class="axis">1.0 · parity</text>
  <text x="899" y="596" text-anchor="middle" class="axis">1.2</text>
  <text x="1133" y="596" text-anchor="middle" class="axis">1.4</text>
  <text x="1250" y="596" text-anchor="middle" class="axis">1.5</text>

  <text x="88" y="657" class="card-title">1 µs</text>
  <rect x="664" y="635" width="361" height="30" rx="8" fill="#86c5e8" stroke="#2f80b7"/>
  <text x="1041" y="656" class="value">1.308</text>
  <text x="1320" y="656" class="body">P99 K/E</text><text x="1450" y="656" class="value">3.05</text>

  <text x="88" y="711" class="card-title">10 µs</text>
  <rect x="664" y="689" width="475" height="30" rx="8" fill="#6fb7df" stroke="#2f80b7"/>
  <text x="1155" y="710" class="value">1.405</text>
  <text x="1320" y="710" class="body">P99 K/E</text><text x="1450" y="710" class="value">2.96</text>

  <text x="88" y="765" class="card-title">100 µs</text>
  <rect x="664" y="743" width="106" height="30" rx="8" fill="#a9d8ee" stroke="#2f80b7"/>
  <text x="786" y="764" class="value">1.090</text>
  <text x="1320" y="764" class="body">P99 K/E</text><text x="1450" y="764" class="value">2.27</text>

  <text x="88" y="819" class="card-title">1 ms</text>
  <rect x="548" y="797" width="116" height="30" rx="8" fill="#f6c177" stroke="#d9822b"/>
  <text x="462" y="818" class="value">0.901</text>
  <text x="1320" y="818" class="body">P99 K/E</text><text x="1450" y="818" class="value">2.83</text>

  <text x="88" y="873" class="card-title">10 ms</text>
  <rect x="651" y="851" width="13" height="30" rx="6" fill="#f6c177" stroke="#d9822b"/>
  <text x="554" y="872" class="value">0.989</text>
  <text x="1320" y="872" class="body">P99 K/E</text><text x="1450" y="872" class="value">1.29</text>

  <text x="430" y="908" class="small">橙色：Linux-task makespan 较低</text>
  <text x="950" y="908" class="small">蓝色：direct-EL0 makespan 较低</text>

  <rect x="48" y="946" width="472" height="126" rx="16" fill="#e8f4ff" stroke="#2f80b7"/>
  <text x="72" y="980" class="card-title">≤ 10 µs</text>
  <text x="72" y="1008" class="body">direct-EL0：固定机制成本更低</text>
  <text x="72" y="1036" class="small">吞吐高 30.8%--40.5%；P99 明显较低</text>

  <rect x="564" y="946" width="472" height="126" rx="16" fill="#f3f7fa" stroke="#829ab1"/>
  <text x="588" y="980" class="card-title">≈ 100 µs</text>
  <text x="588" y="1008" class="body">crossover 区间：增加 seeds</text>
  <text x="588" y="1036" class="small">makespan range 跨过 1.0；tail 仍偏向 EL0</text>

  <rect x="1080" y="946" width="472" height="126" rx="16" fill="#fff3df" stroke="#d9822b"/>
  <text x="1104" y="980" class="card-title">≥ 1 ms</text>
  <text x="1104" y="1008" class="body">batch makespan 可选 Linux task</text>
  <text x="1104" y="1036" class="small">tail SLO 继续偏向 direct-EL0 coroutine</text>

  <text x="48" y="1102" class="small">n4-910c · 30/30 cases pass · 15 paired cases · fixed virtual latency · 3 seeds · residual QEMU = 0</text>
</svg>
