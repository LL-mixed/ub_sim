<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820"
     viewBox="0 0 1280 820" role="img"
     aria-labelledby="title description">
  <title id="title">Async-load ABI v3 EL0 event ring with SVC and WFE</title>
  <desc id="description">
    QEMU publishes async-load events into a producer ring, the guest EL0
    coroutine scheduler consumes and acknowledges them through a consumer
    page. Context resume uses a private SVC fast path, while WFE plus a
    completion IRQ closes the idle wait and wakeup path.
  </desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9"
            refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9"
            refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9"
            refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/>
    </marker>
    <style>
      text { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans CJK SC", sans-serif; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #334155; }
      .box-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #334155; }
      .step { font-size: 13px; font-weight: 600; }
      .lane { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .blue { stroke: #2563eb; stroke-width: 2.5; fill: none;
        marker-end: url(#arrow-blue); }
      .green { stroke: #15803d; stroke-width: 2.5; fill: none;
        marker-end: url(#arrow-green); }
      .orange { stroke: #c2410c; stroke-width: 2.5; fill: none;
        marker-end: url(#arrow-orange); }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="820" fill="#ffffff"/>
  <text x="48" y="48" class="title">Async-load ABI v3：EL0 event ring、SVC resume 与 WFE/IRQ</text>
  <text x="48" y="76" class="subtitle">event payload 由 EL0 直接处理；resume 经 SVC fast path，idle wakeup 经 completion IRQ</text>

  <rect x="48" y="112" width="270" height="184" rx="14"
        fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="72" y="144" class="box-title">QEMU / simulated core</text>
  <text x="72" y="174" class="body">• Cacheable fill / NC PLT</text>
  <text x="72" y="198" class="body">• PENDING / COMPLETE / FAULT</text>
  <text x="72" y="222" class="body">• descriptor-first DMA publish</text>
  <text x="72" y="246" class="body">• direct upcall / completion IRQ</text>
  <text x="72" y="274" class="small">producer + wakeup owner</text>

  <rect x="382" y="112" width="270" height="184" rx="14"
        fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="406" y="144" class="box-title">Producer / event ring</text>
  <text x="406" y="174" class="body">header: ABI / owner / producer_seq</text>
  <text x="406" y="198" class="body">slot[N]: 128-byte event descriptor</text>
  <text x="406" y="222" class="body">QEMU: read-write DMA mapping</text>
  <text x="406" y="246" class="body">guest EL0: read-only mapping</text>
  <text x="406" y="274" class="small">acquire-load producer_seq</text>

  <rect x="716" y="112" width="270" height="184" rx="14"
        fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="740" y="144" class="box-title">EL0 coroutine scheduler</text>
  <text x="740" y="174" class="body">• save interrupted context</text>
  <text x="740" y="198" class="body">• validate + apply event</text>
  <text x="740" y="222" class="body">• choose READY coroutine</text>
  <text x="740" y="246" class="body">• replay-only retirement</text>
  <text x="740" y="274" class="small">consumer + scheduling policy owner</text>

  <rect x="1044" y="112" width="188" height="184" rx="14"
        fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="1068" y="144" class="box-title">Consumer page</text>
  <text x="1068" y="174" class="body">owner generation</text>
  <text x="1068" y="198" class="body">consumer_seq</text>
  <text x="1068" y="222" class="body">wait_count</text>
  <text x="1068" y="246" class="body">scheduler_enter_count</text>
  <text x="1068" y="274" class="small">EL0 read-write mapping</text>

  <path d="M318 170 H382" class="blue"/>
  <text x="350" y="158" text-anchor="middle" class="small">publish</text>
  <path d="M652 208 H716" class="green"/>
  <text x="684" y="196" text-anchor="middle" class="small">consume</text>
  <path d="M986 208 H1044" class="orange"/>
  <text x="1015" y="196" text-anchor="middle" class="small">ack</text>
  <path d="M1044 264 C990 338, 372 338, 318 264" class="orange"/>
  <text x="682" y="332" text-anchor="middle" class="small">QEMU validates consumer_seq / owner / capacity</text>

  <rect x="48" y="366" width="1184" height="64" rx="12"
        fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="72" y="394" class="box-title">复用 Arm 指令通路</text>
  <text x="360" y="394" class="body">SVC #0x5343 context resume</text>
  <text x="650" y="394" class="body">SEVL / WFE idle wait</text>
  <text x="900" y="394" class="body">SVC #0x5345 scheduler-enter</text>
  <text x="72" y="416" class="small">两个 SVC 仅在 active owner-matched session 进入受控 fast path；旧的三个 HLT 拦截已删除</text>

  <text x="48" y="474" class="box-title">All-blocked wait / wakeup 时序</text>
  <text x="170" y="510" text-anchor="middle" class="step">EL0 scheduler</text>
  <text x="550" y="510" text-anchor="middle" class="step">guest EL1 IRQ path</text>
  <text x="900" y="510" text-anchor="middle" class="step">remote completion</text>
  <line x1="170" y1="524" x2="170" y2="780" class="lane"/>
  <line x1="550" y1="524" x2="550" y2="780" class="lane"/>
  <line x1="900" y1="524" x2="900" y2="780" class="lane"/>

  <path d="M170 552 H550" class="orange"/>
  <text x="360" y="542" text-anchor="middle" class="small">1. SEVL; WFE；recheck ring；WFE</text>
  <rect x="496" y="570" width="108" height="44" rx="8"
        fill="#fff7ed" stroke="#c2410c"/>
  <text x="550" y="588" text-anchor="middle" class="small">2. vCPU 等待</text>
  <text x="550" y="605" text-anchor="middle" class="small">EL0 不轮询 CQ</text>
  <path d="M900 642 H550" class="blue"/>
  <text x="725" y="632" text-anchor="middle" class="small">3. COMPLETE publish + IRQ</text>
  <rect x="486" y="658" width="128" height="52" rx="8"
        fill="#eff6ff" stroke="#2563eb"/>
  <text x="550" y="678" text-anchor="middle" class="small">4. IRQ handler ACK</text>
  <text x="550" y="696" text-anchor="middle" class="small">标准 exception return</text>
  <path d="M550 738 H170" class="green"/>
  <text x="360" y="728" text-anchor="middle" class="small">5. 返回 EL0；acquire-drain ring</text>
  <rect x="68" y="752" width="204" height="48" rx="8"
        fill="#f0fdf4" stroke="#15803d"/>
  <text x="170" y="772" text-anchor="middle" class="small">6. coroutine READY</text>
  <text x="170" y="790" text-anchor="middle" class="small">resume selected context</text>
</svg>
