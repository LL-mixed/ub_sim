<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #46546f; }
      .heading { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .body { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #26334d; }
      .small { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #46546f; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #26334d; }
      .metric { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #165a46; }
      .card { stroke: #aab5c8; stroke-width: 2; rx: 18; }
      .arrow { stroke: #52637f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .cell { stroke: #70809c; stroke-width: 1.4; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#52637f"/>
    </marker>
  </defs>

  <rect width="1600" height="1120" fill="#f8fafc"/>
  <text x="70" y="66" class="title">P4I：stride、DN、NZ 直接访问 PTO UB_GM</text>
  <text x="70" y="100" class="subtitle">同一 lingqu_shmem_memref → tag-10 Dispatch → QEMU authorization → PTO TLOAD/TSTORE 路径</text>

  <rect x="55" y="135" width="470" height="430" class="card" fill="#eaf2ff"/>
  <text x="82" y="178" class="heading">ND-strided</text>
  <text x="82" y="211" class="mono">shape   = [1,1,1,3,5]</text>
  <text x="82" y="239" class="mono">strides = [24,24,24,8,1]</text>
  <text x="82" y="270" class="body">3 行 × 5 个 f32；行间保留 3 个空洞元素</text>

  <g transform="translate(84 300)">
    <rect x="0" y="0" width="40" height="38" class="cell" fill="#a8d7c7"/>
    <rect x="40" y="0" width="40" height="38" class="cell" fill="#a8d7c7"/>
    <rect x="80" y="0" width="40" height="38" class="cell" fill="#a8d7c7"/>
    <rect x="120" y="0" width="40" height="38" class="cell" fill="#a8d7c7"/>
    <rect x="160" y="0" width="40" height="38" class="cell" fill="#a8d7c7"/>
    <rect x="200" y="0" width="40" height="38" class="cell" fill="#d9dee8"/>
    <rect x="240" y="0" width="40" height="38" class="cell" fill="#d9dee8"/>
    <rect x="280" y="0" width="40" height="38" class="cell" fill="#d9dee8"/>
    <rect x="0" y="50" width="40" height="38" class="cell" fill="#a8d7c7"/>
    <rect x="40" y="50" width="40" height="38" class="cell" fill="#a8d7c7"/>
    <rect x="80" y="50" width="40" height="38" class="cell" fill="#a8d7c7"/>
    <rect x="120" y="50" width="40" height="38" class="cell" fill="#a8d7c7"/>
    <rect x="160" y="50" width="40" height="38" class="cell" fill="#a8d7c7"/>
    <rect x="200" y="50" width="40" height="38" class="cell" fill="#d9dee8"/>
    <rect x="240" y="50" width="40" height="38" class="cell" fill="#d9dee8"/>
    <rect x="280" y="50" width="40" height="38" class="cell" fill="#d9dee8"/>
    <rect x="0" y="100" width="40" height="38" class="cell" fill="#a8d7c7"/>
    <rect x="40" y="100" width="40" height="38" class="cell" fill="#a8d7c7"/>
    <rect x="80" y="100" width="40" height="38" class="cell" fill="#a8d7c7"/>
    <rect x="120" y="100" width="40" height="38" class="cell" fill="#a8d7c7"/>
    <rect x="160" y="100" width="40" height="38" class="cell" fill="#a8d7c7"/>
  </g>
  <text x="82" y="480" class="metric">每个 tensor：3 × 20 B fragment</text>
  <text x="82" y="514" class="body">A/B 共 6 load；Out 共 3 store；view extent 84 B</text>
  <text x="82" y="543" class="small">oracle 同时检查 3 处行间空洞保持原值</text>

  <rect x="565" y="135" width="470" height="430" class="card" fill="#fff4df"/>
  <text x="592" y="178" class="heading">DN</text>
  <text x="592" y="211" class="mono">shape   = [1,1,1,3,5]</text>
  <text x="592" y="239" class="mono">strides = [15,15,15,1,3]</text>
  <text x="592" y="270" class="body">逻辑 3×5；最后两维按转置顺序映射</text>

  <g transform="translate(610 302)">
    <rect x="0" y="0" width="65" height="52" class="cell" fill="#f3c77c"/>
    <rect x="65" y="0" width="65" height="52" class="cell" fill="#f3c77c"/>
    <rect x="130" y="0" width="65" height="52" class="cell" fill="#f3c77c"/>
    <rect x="195" y="0" width="65" height="52" class="cell" fill="#f3c77c"/>
    <rect x="260" y="0" width="65" height="52" class="cell" fill="#f3c77c"/>
    <rect x="0" y="52" width="65" height="52" class="cell" fill="#f6d69e"/>
    <rect x="65" y="52" width="65" height="52" class="cell" fill="#f6d69e"/>
    <rect x="130" y="52" width="65" height="52" class="cell" fill="#f6d69e"/>
    <rect x="195" y="52" width="65" height="52" class="cell" fill="#f6d69e"/>
    <rect x="260" y="52" width="65" height="52" class="cell" fill="#f6d69e"/>
    <rect x="0" y="104" width="65" height="52" class="cell" fill="#f9e4bd"/>
    <rect x="65" y="104" width="65" height="52" class="cell" fill="#f9e4bd"/>
    <rect x="130" y="104" width="65" height="52" class="cell" fill="#f9e4bd"/>
    <rect x="195" y="104" width="65" height="52" class="cell" fill="#f9e4bd"/>
    <rect x="260" y="104" width="65" height="52" class="cell" fill="#f9e4bd"/>
  </g>
  <text x="592" y="480" class="metric">每个 tensor：1 × 60 B contiguous range</text>
  <text x="592" y="514" class="body">A/B 共 2 load；Out 共 1 store；view extent 60 B</text>
  <text x="592" y="543" class="small">物理 extent 连续，元素排列由 stride 描述</text>

  <rect x="1075" y="135" width="470" height="430" class="card" fill="#f1ebff"/>
  <text x="1102" y="178" class="heading">NZ</text>
  <text x="1102" y="211" class="mono">shape   = [1,1,1,16,8]</text>
  <text x="1102" y="239" class="mono">strides = [128,128,128,8,1]</text>
  <text x="1102" y="270" class="body">16×8 f32 block；128 个元素形成 512 B extent</text>

  <g transform="translate(1110 302)">
    <rect x="0" y="0" width="360" height="160" rx="10" fill="#d9c8f4" stroke="#7b68a7" stroke-width="2"/>
    <path d="M45 0 V160 M90 0 V160 M135 0 V160 M180 0 V160 M225 0 V160 M270 0 V160 M315 0 V160" stroke="#9581bd" stroke-width="1.3"/>
    <path d="M0 20 H360 M0 40 H360 M0 60 H360 M0 80 H360 M0 100 H360 M0 120 H360 M0 140 H360" stroke="#9581bd" stroke-width="1.3"/>
    <text x="118" y="90" class="heading">16 × 8 f32</text>
  </g>
  <text x="1102" y="480" class="metric">每个 tensor：1 × 512 B contiguous range</text>
  <text x="1102" y="514" class="body">A/B 共 2 load；Out 共 1 store；view extent 512 B</text>
  <text x="1102" y="543" class="small">NZ 物理 block 在本 case 中可合并为单一 callback</text>

  <rect x="55" y="610" width="1490" height="255" class="card" fill="#ffffff"/>
  <text x="82" y="652" class="heading">共同直接访问路径</text>

  <rect x="82" y="690" width="220" height="92" rx="12" fill="#e8f4ff" stroke="#7995b7" stroke-width="2"/>
  <text x="110" y="726" class="body">lingqu_shmem_memref</text>
  <text x="110" y="754" class="small">shape + strides + role</text>

  <path d="M302 736 H350" class="arrow"/>
  <rect x="350" y="690" width="220" height="92" rx="12" fill="#fff4df" stroke="#ad8a4d" stroke-width="2"/>
  <text x="382" y="726" class="body">QEMU authorization</text>
  <text x="382" y="754" class="small">84 / 60 / 512 B view</text>

  <path d="M570 736 H618" class="arrow"/>
  <rect x="618" y="690" width="220" height="92" rx="12" fill="#e9f7ef" stroke="#67997d" stroke-width="2"/>
  <text x="654" y="726" class="body">AddressSpace::UB_GM</text>
  <text x="654" y="754" class="small">dispatch-local binding</text>

  <path d="M838 736 H886" class="arrow"/>
  <rect x="886" y="690" width="220" height="92" rx="12" fill="#f1ebff" stroke="#8b76b0" stroke-width="2"/>
  <text x="920" y="726" class="body">PTO fragment planner</text>
  <text x="920" y="754" class="small">TLOAD / TSTORE ranges</text>

  <path d="M1106 736 H1154" class="arrow"/>
  <rect x="1154" y="690" width="220" height="92" rx="12" fill="#eaf2ff" stroke="#7995b7" stroke-width="2"/>
  <text x="1190" y="726" class="body">QEMU UB GM callback</text>
  <text x="1190" y="754" class="small">OBMM backing read/write</text>

  <path d="M1374 736 H1422" class="arrow"/>
  <rect x="1422" y="690" width="95" height="92" rx="12" fill="#e9f7ef" stroke="#67997d" stroke-width="2"/>
  <text x="1443" y="726" class="body">Node A</text>
  <text x="1440" y="754" class="small">oracle</text>

  <text x="82" y="828" class="metric">所有 layout：TSTORE 后 fence = 1；segment_payload_staging_bytes = 0</text>

  <rect x="55" y="905" width="1490" height="160" class="card" fill="#e9f7ef"/>
  <text x="82" y="949" class="heading">双机 formal evidence</text>
  <text x="82" y="987" class="metric">n4-910c 3/3 pass　　n4-910c1 3/3 pass　　合计 6/6 pass</text>
  <text x="82" y="1024" class="body">fingerprint stable = 1　·　source/snapshot hashes matched　·　QEMU leftovers = 0</text>
  <text x="82" y="1052" class="small">默认 feature set：sim_npu / GVA / GSVA 日志与 counters 均为 0；n4-910c P3 evaluator 保持 Tl</text>
</svg>
