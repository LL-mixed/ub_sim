<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980"
     viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">submit/await submit await compared with async load direct EL0 upcall</title>
  <desc id="desc">Both mechanisms use a guest EL0 coroutine scheduler. submit/await
  exposes submit and await in the data plane. async load preserves an ordinary
  unretired load, uses a QEMU direct EL0 upcall, and lets EL0 save, select,
  patch and resume contexts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf8"/>
      <stop offset="1" stop-color="#eaf2f2"/>
    </linearGradient>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#356f8b"/>
    </marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#34765f"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans CJK SC", "PingFang SC", sans-serif;
             fill: #18332f; }
      .kicker { font-size: 14px; font-weight: 750; letter-spacing: 2px; fill: #4d7169; }
      .title { font-size: 31px; font-weight: 790; }
      .subtitle { font-size: 16px; fill: #526c66; }
      .lane { font-size: 21px; font-weight: 790; }
      .lane-sub { font-size: 14px; fill: #526c66; }
      .box-title { font-size: 15px; font-weight: 760; }
      .copy { font-size: 13px; fill: #405b55; }
      .step { font-size: 13px; font-weight: 800; }
      .table-head { font-size: 14px; font-weight: 780; }
      .table-copy { font-size: 13px; fill: #38534d; }
      .strong { font-size: 14px; font-weight: 770; }
    </style>
  </defs>

  <rect width="1500" height="980" fill="url(#bg)"/>
  <text x="52" y="42" class="kicker">submit/await vs async load · SAME EL0 SCHEDULER, DIFFERENT SPLIT POINT</text>
  <text x="52" y="84" class="title">关键区别不是“有没有协程”，而是 remote load 在哪里被拆分</text>
  <text x="52" y="114" class="subtitle">两条路径的 context 保存和选择都在 guest EL0；async load 额外要求 core 保持普通 LDR 未退休并直接 upcall。</text>

  <g transform="translate(52 146)">
    <rect width="678" height="500" rx="22" fill="#eef6fa" stroke="#a9c8d7"/>
    <text x="24" y="40" class="lane">submit/await · 显式 submit / await</text>
    <text x="24" y="65" class="lane-sub">标准 Arm/Linux 软件路径；拆分点对 runtime/编译器可见</text>

    <g transform="translate(24 92)">
      <rect width="190" height="92" rx="13" fill="#ffffff" stroke="#a9c8d7"/>
      <circle cx="166" cy="18" r="14" fill="#c6ddea"/>
      <text x="166" y="23" text-anchor="middle" class="step">1</text>
      <text x="14" y="31" class="box-title">A: submit(remote, dst)</text>
      <text x="14" y="56" class="copy">请求先退休</text>
      <text x="14" y="77" class="copy">future = IN_FLIGHT</text>
    </g>
    <g transform="translate(244 92)">
      <rect width="190" height="92" rx="13" fill="#fff7eb" stroke="#d9bb8b"/>
      <circle cx="166" cy="18" r="14" fill="#efd1a6"/>
      <text x="166" y="23" text-anchor="middle" class="step">2</text>
      <text x="14" y="31" class="box-title">A: await(token)</text>
      <text x="14" y="56" class="copy">显式 suspension point</text>
      <text x="14" y="77" class="copy">EL0 保存 A context</text>
    </g>
    <g transform="translate(464 92)">
      <rect width="190" height="92" rx="13" fill="#e8f4ee" stroke="#9fc7b7"/>
      <circle cx="166" cy="18" r="14" fill="#c1ded2"/>
      <text x="166" y="23" text-anchor="middle" class="step">3</text>
      <text x="14" y="31" class="box-title">EL0 scheduler</text>
      <text x="14" y="56" class="copy">A → WAIT_REMOTE</text>
      <text x="14" y="77" class="copy">选择并恢复 B</text>
    </g>

    <path d="M214 138 H236" fill="none" stroke="#356f8b" stroke-width="2.3" marker-end="url(#blue)"/>
    <path d="M434 138 H456" fill="none" stroke="#356f8b" stroke-width="2.3" marker-end="url(#blue)"/>

    <g transform="translate(24 228)">
      <rect width="300" height="106" rx="13" fill="#ffffff" stroke="#a9c8d7"/>
      <text x="14" y="31" class="box-title">P1 backend → destination + CQE</text>
      <text x="14" y="57" class="copy">completion status 可表达 timeout/error</text>
      <text x="14" y="80" class="copy">CQ release-publish；EL0 acquire-drain</text>
    </g>
    <g transform="translate(354 228)">
      <rect width="300" height="106" rx="13" fill="#e8f4ee" stroke="#9fc7b7"/>
      <text x="14" y="31" class="box-title">EL0: A READY → resume await</text>
      <text x="14" y="57" class="copy">await 返回 status；软件读取 dst</text>
      <text x="14" y="80" class="copy">没有未退休的普通 LDR</text>
    </g>
    <path d="M324 281 H346" fill="none" stroke="#34765f" stroke-width="2.3" marker-end="url(#green)"/>

    <rect x="24" y="376" width="630" height="92" rx="14" fill="#ffffff" stroke="#b8ced6"/>
    <text x="42" y="407" class="strong">Schedule-ahead</text>
    <text x="42" y="433" class="copy">submit 可以早于真正消费点；A 可先继续计算/提交，到 await 才决定是否切换。</text>
    <text x="42" y="456" class="copy">代价：数据面、编译器 lowering 或源码必须呈现 submit / await contract。</text>
  </g>

  <g transform="translate(770 146)">
    <rect width="678" height="500" rx="22" fill="#eef6f1" stroke="#a6cab9"/>
    <text x="24" y="40" class="lane">async load · 普通 LDR + direct EL0 upcall</text>
    <text x="24" y="65" class="lane-sub">自定义 core ABI；数据面没有 submit/await，但 EL0 scheduler 仍显式存在</text>

    <g transform="translate(24 92)">
      <rect width="190" height="92" rx="13" fill="#ffffff" stroke="#a6cab9"/>
      <circle cx="166" cy="18" r="14" fill="#c1ded2"/>
      <text x="166" y="23" text-anchor="middle" class="step">1</text>
      <text x="14" y="31" class="box-title">A: LDR X3, [remote]</text>
      <text x="14" y="56" class="copy">程序无 submit / await</text>
      <text x="14" y="77" class="copy">remote miss → PLT</text>
    </g>
    <g transform="translate(244 92)">
      <rect width="190" height="92" rx="13" fill="#fff7eb" stroke="#d9bb8b"/>
      <circle cx="166" cy="18" r="14" fill="#efd1a6"/>
      <text x="166" y="23" text-anchor="middle" class="step">2</text>
      <text x="14" y="31" class="box-title">QEMU/core</text>
      <text x="14" y="56" class="copy">LDR 未退休</text>
      <text x="14" y="77" class="copy">PC → EL0 upcall entry</text>
    </g>
    <g transform="translate(464 92)">
      <rect width="190" height="92" rx="13" fill="#e8f4ee" stroke="#9fc7b7"/>
      <circle cx="166" cy="18" r="14" fill="#c1ded2"/>
      <text x="166" y="23" text-anchor="middle" class="step">3</text>
      <text x="14" y="31" class="box-title">Guest EL0 scheduler</text>
      <text x="14" y="56" class="copy">assembly 保存 A</text>
      <text x="14" y="77" class="copy">A WAIT；选择 B</text>
    </g>

    <path d="M214 138 H236" fill="none" stroke="#356f8b" stroke-width="2.3" marker-end="url(#blue)"/>
    <path d="M434 138 H456" fill="none" stroke="#356f8b" stroke-width="2.3" marker-end="url(#blue)"/>

    <g transform="translate(24 228)">
      <rect width="300" height="106" rx="13" fill="#ffffff" stroke="#a6cab9"/>
      <text x="14" y="31" class="box-title">P1 completion → QEMU event</text>
      <text x="14" y="57" class="copy">next EL0 boundary 再 direct upcall</text>
      <text x="14" y="80" class="copy">QEMU 不写 GPR，不选择 context</text>
    </g>
    <g transform="translate(354 228)">
      <rect width="300" height="106" rx="13" fill="#e8f4ee" stroke="#9fc7b7"/>
      <text x="14" y="31" class="box-title">EL0 patch A.saved Rt / PC</text>
      <text x="14" y="57" class="copy">x3=value；pc=fault_pc+4</text>
      <text x="14" y="80" class="copy">HLT #0x5343 恢复 EL0 所选 context</text>
    </g>
    <path d="M324 281 H346" fill="none" stroke="#34765f" stroke-width="2.3" marker-end="url(#green)"/>

    <rect x="24" y="376" width="630" height="92" rx="14" fill="#ffffff" stroke="#b8d2c5"/>
    <text x="42" y="407" class="strong">Demand-pending</text>
    <text x="42" y="433" class="copy">直到普通 LDR 真正执行才启动 remote latency；默认没有 pre-submit 窗口。</text>
    <text x="42" y="456" class="copy">代价：core 必须提供 PLT、direct EL0 event 和原子 context-install mechanism。</text>
  </g>

  <g transform="translate(52 684)">
    <rect width="1396" height="244" rx="22" fill="#ffffff" stroke="#cbdad6"/>
    <text x="24" y="38" class="lane">差异矩阵</text>

    <rect x="24" y="58" width="220" height="40" rx="8" fill="#edf2f0"/>
    <rect x="244" y="58" width="548" height="40" fill="#eaf3f8"/>
    <rect x="792" y="58" width="580" height="40" rx="8" fill="#eaf4ef"/>
    <text x="40" y="83" class="table-head">维度</text>
    <text x="264" y="83" class="table-head">submit/await submit / await</text>
    <text x="812" y="83" class="table-head">async load direct EL0 upcall</text>

    <g class="table-copy">
      <text x="40" y="124">拆分点</text><text x="264" y="124">submit 已退休；await 是显式挂起点</text><text x="812" y="124">普通 LDR pending；load 保持未退休</text>
      <text x="40" y="151">context owner</text><text x="264" y="151">guest EL0 runtime</text><text x="812" y="151">guest EL0 runtime（相同）</text>
      <text x="40" y="178">QEMU/core 责任</text><text x="264" y="178">SQ/CQ endpoint + P1</text><text x="812" y="178">PLT + direct upcall + atomic install；无 policy</text>
      <text x="40" y="205">completion</text><text x="264" y="205">CQ status + destination buffer</text><text x="812" y="205">EL0 patch 保存态 Rt / PC</text>
      <text x="40" y="232">提前量</text><text x="264" y="232">可 schedule ahead</text><text x="812" y="232">v2 仅 demand pending</text>
    </g>
  </g>

  <text x="52" y="958" class="subtitle">共同点：A 等待时都由同一 guest vCPU 执行 ready 的 B；两者都不是 QEMU host coroutine。</text>
</svg>
