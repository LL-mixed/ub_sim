<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940"
     viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
  <title id="title">async load direct EL0 upcall and EL0 coroutine scheduler</title>
  <desc id="desc">QEMU simulates direct EL0 pending and completion upcalls.
  Guest EL0 assembly saves coroutine context and the guest EL0 scheduler owns
  ready queues, selection, result patching and context resume.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faf7"/>
      <stop offset="1" stop-color="#eaf3f1"/>
    </linearGradient>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#356d8a"/>
    </marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#34765f"/>
    </marker>
    <marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#a46724"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans CJK SC", "PingFang SC", sans-serif;
             fill: #18332f; }
      .kicker { font-size: 14px; font-weight: 750; letter-spacing: 2px; fill: #4f716a; }
      .title { font-size: 31px; font-weight: 780; }
      .subtitle { font-size: 16px; fill: #526b66; }
      .lane { font-size: 20px; font-weight: 780; }
      .box-title { font-size: 16px; font-weight: 760; }
      .copy { font-size: 13px; fill: #405a55; }
      .small { font-size: 12px; fill: #536c67; }
      .step { font-size: 13px; font-weight: 800; }
      .note { font-size: 14px; fill: #334f49; }
      .strong { font-size: 14px; font-weight: 760; }
    </style>
  </defs>

  <rect width="1500" height="940" fill="url(#bg)"/>
  <text x="52" y="42" class="kicker">async load · CUSTOM DIRECT-TO-EL0 UPCALL</text>
  <text x="52" y="84" class="title">QEMU 只交付事件；guest EL0 保存上下文、选择并恢复 coroutine</text>
  <text x="52" y="114" class="subtitle">普通 LDR 保持未退休；调度策略和 Context Store 不在 QEMU，全部属于 EL0 runtime。</text>

  <g transform="translate(52 146)">
    <rect width="1396" height="610" rx="22" fill="#ffffff" stroke="#cfddd9"/>

    <rect x="20" y="20" width="324" height="570" rx="18" fill="#edf5f9" stroke="#abc9d7"/>
    <text x="40" y="54" class="lane">Application execution</text>
    <g transform="translate(40 78)">
      <rect width="284" height="92" rx="13" fill="#ffffff" stroke="#a9c7d5"/>
      <circle cx="260" cy="19" r="14" fill="#c6ddea"/>
      <text x="260" y="24" text-anchor="middle" class="step">1</text>
      <text x="16" y="31" class="box-title">Coroutine A @ EL0</text>
      <text x="16" y="56" class="copy">LDR X3, [remote]</text>
      <text x="16" y="78" class="copy">无 submit / await / yield</text>
    </g>
    <g transform="translate(40 196)">
      <rect width="284" height="108" rx="13" fill="#fff5e8" stroke="#d9b783"/>
      <circle cx="260" cy="19" r="14" fill="#efd1a6"/>
      <text x="260" y="24" text-anchor="middle" class="step">2</text>
      <text x="16" y="31" class="box-title">原 LDR 未退休</text>
      <text x="16" y="56" class="copy">PC=P，X3=old</text>
      <text x="16" y="78" class="copy">PLT 保存 token / Rt / width</text>
      <text x="16" y="99" class="copy">remote request 进入 P1</text>
    </g>
    <g transform="translate(40 450)">
      <rect width="284" height="92" rx="13" fill="#eaf5ef" stroke="#9fc8b8"/>
      <circle cx="260" cy="19" r="14" fill="#c2dfd3"/>
      <text x="260" y="24" text-anchor="middle" class="step">8</text>
      <text x="16" y="31" class="box-title">EL0 恢复 B 或 A</text>
      <text x="16" y="56" class="copy">选 A：PC=P+4，X3=value</text>
      <text x="16" y="78" class="copy">选 B：从 B.saved_pc 继续</text>
    </g>

    <rect x="370" y="20" width="306" height="570" rx="18" fill="#f5f7f5" stroke="#c4d1cd"/>
    <text x="390" y="54" class="lane">QEMU/core mechanism</text>
    <g transform="translate(390 78)">
      <rect width="266" height="112" rx="13" fill="#fff8ed" stroke="#d6bd95"/>
      <text x="16" y="30" class="box-title">RLA + PLT + P1 sink</text>
      <text x="16" y="55" class="copy">classify / probe / submit</text>
      <text x="16" y="77" class="copy">generation-safe completion</text>
      <text x="16" y="99" class="copy">不保存 coroutine context</text>
    </g>
    <g transform="translate(390 220)">
      <rect width="266" height="112" rx="13" fill="#eaf2f7" stroke="#a9c5d5"/>
      <circle cx="242" cy="19" r="14" fill="#c4dae7"/>
      <text x="242" y="24" text-anchor="middle" class="step">3</text>
      <text x="16" y="30" class="box-title">direct EL0 upcall</text>
      <text x="16" y="55" class="copy">event.interrupted_pc = P</text>
      <text x="16" y="77" class="copy">PC → registered EL0 entry</text>
      <text x="16" y="99" class="copy">GPR / SP / SIMD 保持不变</text>
    </g>
    <g transform="translate(390 362)">
      <rect width="266" height="128" rx="13" fill="#edf5f1" stroke="#a6c9ba"/>
      <circle cx="242" cy="19" r="14" fill="#c5dfd4"/>
      <text x="242" y="24" text-anchor="middle" class="step">7</text>
      <text x="16" y="30" class="box-title">OBMM_ASYNC_LOAD_RESUME</text>
      <text x="16" y="55" class="copy">EL0: HLT #0x5343，x0=context*</text>
      <text x="16" y="77" class="copy">core 原子安装选中 context</text>
      <text x="16" y="99" class="copy">清 upcall_active，退出 TB</text>
      <text x="16" y="119" class="copy">不决定 context 是谁</text>
    </g>
    <text x="390" y="538" class="strong">禁止：QEMU ready queue / round-robin</text>
    <text x="390" y="563" class="strong">禁止：QEMU Context Store</text>

    <rect x="702" y="20" width="374" height="570" rx="18" fill="#edf6f2" stroke="#a9cbbb"/>
    <text x="722" y="54" class="lane">Guest EL0 coroutine scheduler</text>
    <g transform="translate(722 78)">
      <rect width="334" height="122" rx="13" fill="#ffffff" stroke="#a9cbbb"/>
      <circle cx="310" cy="19" r="14" fill="#c4dfd3"/>
      <text x="310" y="24" text-anchor="middle" class="step">4</text>
      <text x="16" y="30" class="box-title">upcall entry assembly</text>
      <text x="16" y="55" class="copy">保存 x0..x30 / SP / NZCV</text>
      <text x="16" y="77" class="copy">保存 Q0..Q31 / FPCR / FPSR / TLS</text>
      <text x="16" y="101" class="copy">切 scheduler stack → 复制到 Context Store</text>
    </g>
    <g transform="translate(722 226)">
      <rect width="334" height="144" rx="13" fill="#ffffff" stroke="#a9cbbb"/>
      <circle cx="310" cy="19" r="14" fill="#c4dfd3"/>
      <text x="310" y="24" text-anchor="middle" class="step">5</text>
      <text x="16" y="30" class="box-title">EL0 policy + Context Store</text>
      <text x="16" y="55" class="copy">PENDING: A → WAIT_REMOTE</text>
      <text x="16" y="77" class="copy">COMPLETE: patch A.saved_x[Rt]</text>
      <text x="16" y="99" class="copy">A.saved_pc = fault_pc + 4</text>
      <text x="16" y="121" class="copy">round-robin choose READY B / A</text>
    </g>
    <g transform="translate(722 398)">
      <rect width="334" height="92" rx="13" fill="#e5f2ec" stroke="#98c4b2"/>
      <circle cx="310" cy="19" r="14" fill="#bddbce"/>
      <text x="310" y="24" text-anchor="middle" class="step">6</text>
      <text x="16" y="30" class="box-title">EL0 chooses context</text>
      <text x="16" y="55" class="copy">x0 = &amp;B.context 或 &amp;A.context</text>
      <text x="16" y="77" class="copy">执行自定义 resume mechanism</text>
    </g>
    <text x="722" y="535" class="strong">save / state / policy / selection 全在 EL0</text>
    <text x="722" y="561" class="small">handler 不是 Linux signal，也不进入 EL1 vector</text>

    <rect x="1102" y="20" width="274" height="570" rx="18" fill="#fff7eb" stroke="#d9bd91"/>
    <text x="1122" y="54" class="lane">Remote path</text>
    <g transform="translate(1122 78)">
      <rect width="234" height="118" rx="13" fill="#ffffff" stroke="#d5b889"/>
      <text x="16" y="30" class="box-title">P1 common backend</text>
      <text x="16" y="55" class="copy">bounded in-flight</text>
      <text x="16" y="77" class="copy">timeout / cancel / retire</text>
      <text x="16" y="99" class="copy">provider-neutral sink</text>
    </g>
    <g transform="translate(1122 226)">
      <rect width="234" height="102" rx="13" fill="#ffffff" stroke="#d5b889"/>
      <text x="16" y="30" class="box-title">SIM_DEC read</text>
      <text x="16" y="55" class="copy">latency / jitter / failure</text>
      <text x="16" y="77" class="copy">result(token, value/status)</text>
    </g>
    <g transform="translate(1122 360)">
      <rect width="234" height="112" rx="13" fill="#fffdf8" stroke="#d5b889"/>
      <text x="16" y="30" class="box-title">completion delivery</text>
      <text x="16" y="55" class="copy">enqueue COMPLETE / FAULT</text>
      <text x="16" y="77" class="copy">kick home CPU</text>
      <text x="16" y="99" class="copy">不直接写 GPR / PC</text>
    </g>
    <text x="1122" y="535" class="small">provider 不理解 coroutine</text>
    <text x="1122" y="559" class="small">P1 不包含 EL0 scheduler</text>

    <path d="M324 250 C360 250 350 134 382 134" fill="none" stroke="#a46724" stroke-width="2.5" marker-end="url(#amber)"/>
    <path d="M523 190 V212" fill="none" stroke="#356d8a" stroke-width="2.5" marker-end="url(#blue)"/>
    <path d="M656 134 V68 H1086 V137 H1114" fill="none" stroke="#a46724" stroke-width="2.5" marker-end="url(#amber)"/>
    <path d="M1239 196 V218" fill="none" stroke="#a46724" stroke-width="2.5" marker-end="url(#amber)"/>
    <path d="M1239 328 V352" fill="none" stroke="#34765f" stroke-width="2.5" marker-end="url(#green)"/>
    <path d="M1122 416 H1084 V510 H684 V276 H664" fill="none" stroke="#34765f" stroke-width="2.5" marker-end="url(#green)"/>
    <path d="M656 276 H714" fill="none" stroke="#356d8a" stroke-width="2.5" marker-end="url(#blue)"/>
    <path d="M889 200 V218" fill="none" stroke="#356d8a" stroke-width="2.5" marker-end="url(#blue)"/>
    <path d="M889 370 V390" fill="none" stroke="#34765f" stroke-width="2.5" marker-end="url(#green)"/>
    <path d="M722 444 H664" fill="none" stroke="#34765f" stroke-width="2.5" marker-end="url(#green)"/>
    <path d="M390 426 H332" fill="none" stroke="#34765f" stroke-width="2.5" marker-end="url(#green)"/>
  </g>

  <g transform="translate(52 790)">
    <rect width="1396" height="108" rx="20" fill="#ffffff" stroke="#cfddd9"/>
    <text x="24" y="32" class="strong">正确性边界</text>
    <text x="24" y="58" class="note">pending：A.saved_pc=P，A.saved_x3=old；QEMU 只把执行流转入 EL0 entry。</text>
    <text x="24" y="83" class="note">completion：EL0 scheduler patch A.saved_x3=value、A.saved_pc=P+4；只有 EL0 选中 A 后原 load 才完成。</text>
    <rect x="1030" y="20" width="340" height="68" rx="13" fill="#fff3e3" stroke="#d7b784"/>
    <text x="1048" y="46" class="strong">旧实现（作废）</text>
    <text x="1048" y="70" class="copy">QEMU save + round-robin + restore</text>
  </g>
</svg>
