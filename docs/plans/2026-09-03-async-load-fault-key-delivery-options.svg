<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Historical void response fault-to-key options - superseded</title>
  <desc id="desc">对比 ESR wait_key_tag 与 per-PE exception metadata register 两条 void response 投递路线。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 3L0 6Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #475569; }
      .head { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #0f172a; }
      .body { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #334155; }
      .mono { font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1d4ed8; }
      .line { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f8fafc"/>
  <text x="60" y="54" class="title">历史方案：Void response fault-to-key 投递</text>
  <text x="60" y="84" class="sub">2026-09-05 起两条路线均退出主路径；当前无软件 wait_key 或 completion 唤醒。</text>

  <rect x="70" y="120" width="1460" height="150" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text x="95" y="154" class="head">共同起点：UBC 接受 remote LDR</text>
  <rect x="105" y="180" width="390" height="62" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="130" y="207" class="body">1  分配 full wait_key K 与 requester ID</text>
  <text x="130" y="229" class="body">2  release-publish PENDING(K, requester, ...)</text>
  <rect x="580" y="180" width="390" height="62" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="605" y="207" class="body">3  void response 沿原 response route</text>
  <text x="605" y="229" class="body">精确到达原 PE / hardware thread</text>
  <rect x="1055" y="180" width="390" height="62" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="1080" y="207" class="body">4  precise synchronous Data Abort</text>
  <text x="1080" y="229" class="body">EL1 current = 发出 LDR 的 task</text>
  <path d="M495 211H570" class="line"/>
  <path d="M970 211H1045" class="line"/>

  <path d="M800 270V315H405V350" class="line"/>
  <path d="M800 270V315H1195V350" class="line"/>

  <rect x="70" y="350" width="690" height="390" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="100" y="390" class="head">路线 A：ESR 携带 19-bit wait_key_tag</text>
  <text x="100" y="423" class="mono">ISS[24:6] = T ; DFSC[5:0] = 0x3a (PoC private)</text>
  <rect x="110" y="458" width="610" height="90" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="135" y="489" class="body">void_response(T) → ESR_EL1 → handler 取 T</text>
  <text x="135" y="517" class="body">pending_by_tag[{requester, T}] → full K → current task</text>
  <rect x="110" y="580" width="280" height="115" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="135" y="612" class="head">优势</text>
  <text x="135" y="641" class="body">无 per-PE key register</text>
  <text x="135" y="668" class="body">沿用 QEMU 32-bit syndrome</text>
  <rect x="420" y="580" width="300" height="115" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="445" y="612" class="head">代价</text>
  <text x="445" y="641" class="body">tag 回绕/冲突校验</text>
  <text x="445" y="668" class="body">private DFSC + private ISS layout</text>

  <rect x="840" y="350" width="690" height="390" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="870" y="390" class="head">路线 B：per-PE exception metadata register</text>
  <text x="870" y="423" class="mono">KEY[63:0] + VALID ; MRS read ; MSR acknowledge</text>
  <rect x="880" y="458" width="610" height="90" rx="12" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
  <text x="905" y="489" class="body">void_response(K) → per-PE KEY → handler MRS 取 K</text>
  <text x="905" y="517" class="body">pending_by_key[K] → current task → MSR clear VALID</text>
  <rect x="880" y="580" width="280" height="115" rx="12" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
  <text x="905" y="612" class="head">优势</text>
  <text x="905" y="641" class="body">完整 key，无 tag 回绕</text>
  <text x="905" y="668" class="body">保留标准 Data Abort ISS</text>
  <rect x="1190" y="580" width="300" height="115" rx="12" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
  <text x="1215" y="612" class="head">代价</text>
  <text x="1215" y="641" class="body">65 bit / requester 瞬态状态</text>
  <text x="1215" y="668" class="body">sysreg、VMState、EL2 虚拟化</text>

  <path d="M415 740V790H800V830" class="line"/>
  <path d="M1185 740V790H800V830" class="line"/>

  <rect x="230" y="830" width="1140" height="100" rx="16" fill="#ecfdf5" stroke="#4ade80" stroke-width="2"/>
  <text x="260" y="866" class="head">共同终点：full wait_key K → kernel waiter → completion CQ/IRQ → wake task</text>
  <text x="260" y="900" class="body">Cacheable fill、Normal NC replay、timeout、fail-closed 与 locator 路线无关</text>
  <text x="260" y="922" class="body">两条路线均需明确的 fault reason 和 CPU/device capability；0x3a 只用于受控 PoC</text>
</svg>
