<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">OBMM kernel-task async load with Cacheable and NC replay</title>
  <desc id="desc">An EL0 thread issues a remote load, enters EL1 through a data abort, sleeps on a Linux waitqueue, then wakes through a completion queue interrupt and replays through either a cache fill or an NC PLT entry.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 28px system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 15px system-ui, -apple-system, sans-serif; fill: #334155; }
      .lane { font: 700 15px system-ui, -apple-system, sans-serif; fill: #172033; }
      .body { font: 500 14px system-ui, -apple-system, sans-serif; fill: #172033; }
      .small { font: 500 12px system-ui, -apple-system, sans-serif; fill: #334155; }
      .step { font: 700 13px system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .lifeline { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 6; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .blue-arrow { stroke: #2563eb; stroke-width: 2.4; fill: none; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#f8fafc"/>
  <text x="60" y="55" class="title">OBMM Async Load：ESR_EL1 → Linux scheduler → CQ/IRQ → LDR replay</text>
  <text x="60" y="84" class="subtitle">Normal Cacheable 进入普通 line fill；Normal NC 进入 requester UBC NC PLT；两条路径均从原 PC replay。</text>

  <rect x="55" y="110" width="1490" height="78" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="80" y="140" class="lane">控制面（session 启动前）</text>
  <text x="80" y="168" class="body">EL0 注册 remote mapping 与 memory type → driver 配置 owner、home vCPU、CQ/consumer page → start(kernel-task + replay-only)</text>

  <g>
    <rect x="55" y="215" width="230" height="58" rx="9" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="310" y="215" width="230" height="58" rx="9" fill="#ede9fe" stroke="#8b5cf6"/>
    <rect x="565" y="215" width="230" height="58" rx="9" fill="#fef3c7" stroke="#d97706"/>
    <rect x="820" y="215" width="230" height="58" rx="9" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="1075" y="215" width="230" height="58" rx="9" fill="#ffedd5" stroke="#ea580c"/>
    <rect x="1330" y="215" width="215" height="58" rx="9" fill="#fce7f3" stroke="#db2777"/>
    <text x="170" y="249" text-anchor="middle" class="lane">EL0 thread A</text>
    <text x="425" y="240" text-anchor="middle" class="lane">Arm64 TCG /</text>
    <text x="425" y="259" text-anchor="middle" class="lane">async-load device</text>
    <text x="680" y="240" text-anchor="middle" class="lane">EL1 fault core /</text>
    <text x="680" y="259" text-anchor="middle" class="lane">linqu_ub_drv</text>
    <text x="935" y="240" text-anchor="middle" class="lane">Linux scheduler /</text>
    <text x="935" y="259" text-anchor="middle" class="lane">thread B</text>
    <text x="1190" y="240" text-anchor="middle" class="lane">sim-decoder /</text>
    <text x="1190" y="259" text-anchor="middle" class="lane">remote memory</text>
    <text x="1438" y="240" text-anchor="middle" class="lane">event ring CQ /</text>
    <text x="1438" y="259" text-anchor="middle" class="lane">dedicated async-load IRQ</text>
  </g>

  <line x1="170" y1="273" x2="170" y2="980" class="lifeline"/>
  <line x1="425" y1="273" x2="425" y2="980" class="lifeline"/>
  <line x1="680" y1="273" x2="680" y2="980" class="lifeline"/>
  <line x1="935" y1="273" x2="935" y2="980" class="lifeline"/>
  <line x1="1190" y1="273" x2="1190" y2="980" class="lifeline"/>
  <line x1="1438" y1="273" x2="1438" y2="980" class="lifeline"/>

  <circle cx="80" cy="320" r="15" fill="#dbeafe" stroke="#2563eb"/><text x="80" y="325" text-anchor="middle" class="step">1</text>
  <path d="M170 320 L425 320" class="blue-arrow"/>
  <text x="292" y="307" text-anchor="middle" class="body">ordinary LDR [remote GSVA]</text>

  <circle cx="335" cy="380" r="15" fill="#dbeafe" stroke="#2563eb"/><text x="335" y="385" text-anchor="middle" class="step">2</text>
  <path d="M425 380 L1190 380" class="blue-arrow"/>
  <text x="805" y="365" text-anchor="middle" class="body">MMU/type check → Cacheable fill future 或 NC PLT → PENDING-before-submit</text>
  <path d="M425 415 L1438 415" class="blue-arrow"/>
  <text x="930" y="402" text-anchor="middle" class="small">publish PENDING (owner, cookie, wait_key, PC, VA) → submit remote read</text>

  <circle cx="335" cy="465" r="15" fill="#dbeafe" stroke="#2563eb"/><text x="335" y="470" text-anchor="middle" class="step">3</text>
  <path d="M425 465 L680 465" class="blue-arrow"/>
  <text x="553" y="444" text-anchor="middle" class="body">synchronous Data Abort to EL1</text>
  <text x="553" y="461" text-anchor="middle" class="small">ESR.EC=0x24, DFSC=0x3a</text>
  <text x="553" y="480" text-anchor="middle" class="small">FAR=VA, ELR=faulting LDR PC</text>

  <circle cx="590" cy="530" r="15" fill="#fef3c7" stroke="#d97706"/><text x="590" y="535" text-anchor="middle" class="step">4</text>
  <path d="M680 530 L1438 530" class="arrow"/>
  <text x="1060" y="516" text-anchor="middle" class="body">drain PENDING；match cookie + PC + VA + wait_key</text>
  <path d="M680 570 L935 570" class="arrow"/>
  <text x="808" y="556" text-anchor="middle" class="body">waitqueue sleep(thread A)</text>

  <circle cx="845" cy="625" r="15" fill="#dcfce7" stroke="#16a34a"/><text x="845" y="630" text-anchor="middle" class="step">5</text>
  <path d="M935 625 L935 685" class="arrow"/>
  <rect x="835" y="644" width="200" height="48" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="935" y="664" text-anchor="middle" class="body">save task A context</text>
  <text x="935" y="683" text-anchor="middle" class="body">run thread B</text>

  <circle cx="1100" cy="730" r="15" fill="#ffedd5" stroke="#ea580c"/><text x="1100" y="735" text-anchor="middle" class="step">6</text>
  <path d="M1190 730 L425 730" class="blue-arrow"/>
  <text x="805" y="715" text-anchor="middle" class="body">remote completion → Cacheable fill visible / NC PLT replay-ready</text>
  <path d="M425 765 L1438 765" class="blue-arrow"/>
  <text x="930" y="750" text-anchor="middle" class="body">publish COMPLETE/FAULT → set IRQ status → hold dedicated IRQ high</text>

  <circle cx="1350" cy="820" r="15" fill="#fce7f3" stroke="#db2777"/><text x="1350" y="825" text-anchor="middle" class="step">7</text>
  <path d="M1438 820 L680 820" class="blue-arrow"/>
  <text x="1060" y="805" text-anchor="middle" class="body">IRQ handler drains CQ, validates wait_key, wakes waitqueue, then ACKs</text>
  <path d="M680 855 L935 855" class="arrow"/>
  <text x="808" y="842" text-anchor="middle" class="body">thread A runnable</text>

  <circle cx="845" cy="905" r="15" fill="#dcfce7" stroke="#16a34a"/><text x="845" y="910" text-anchor="middle" class="step">8</text>
  <path d="M935 905 L170 905" class="arrow"/>
  <text x="553" y="890" text-anchor="middle" class="body">restore task A → NC 可选 arm token → ERET with unchanged ELR</text>

  <circle cx="80" cy="960" r="15" fill="#dbeafe" stroke="#2563eb"/><text x="80" y="965" text-anchor="middle" class="step">9</text>
  <path d="M170 960 L425 960" class="blue-arrow"/>
  <text x="292" y="945" text-anchor="middle" class="body">same LDR re-executes</text>
  <path d="M425 990 L170 990" class="blue-arrow"/>
  <text x="292" y="1014" text-anchor="middle" class="body">Cacheable cache hit / NC PLT exact-once consume</text>
</svg>
