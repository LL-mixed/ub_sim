<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PTO TLOAD and TSTORE access to Memory Service managed OBMM shared memory</title>
  <desc id="desc">Architecture diagram showing Memory Service object management, managed memref construction, QEMU authorization, Simpler and PTO execution, GSVA resolution, and OBMM shared memory backing.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#12756f"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#b86a18"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102a2a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px system-ui, sans-serif; fill: #172321; }
      .subtitle { font: 400 17px system-ui, sans-serif; fill: #4d615e; }
      .stage { font: 700 15px system-ui, sans-serif; fill: #12756f; }
      .heading { font: 700 22px system-ui, sans-serif; fill: #172321; }
      .body { font: 400 16px system-ui, sans-serif; fill: #344845; }
      .small { font: 400 14px system-ui, sans-serif; fill: #4d615e; }
      .mono { font: 500 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #173e3a; }
      .monoLight { font: 500 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #edf8f6; }
      .box { fill: #ffffff; stroke: #b8cfca; stroke-width: 2; rx: 8; filter: url(#shadow); }
      .chip { fill: #e4f3f0; stroke: #67a79f; stroke-width: 2; rx: 6; }
      .dark { fill: #183f3b; stroke: #0f625d; stroke-width: 2; rx: 8; }
      .memory { fill: #edf6e7; stroke: #7ca868; stroke-width: 2; rx: 6; }
      .line { fill: none; stroke: #12756f; stroke-width: 4; marker-end: url(#arrow); }
      .control { fill: none; stroke: #b86a18; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrowAmber); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f5f8f7"/>
  <rect x="0" y="0" width="1600" height="112" fill="#ffffff"/>
  <text x="60" y="52" class="title">Memory Service managed OBMM backing through PTO TLOAD / TSTORE</text>
  <text x="60" y="84" class="subtitle">Control metadata authorizes an object view; payload accesses follow the UB_GM callback path into the same shared backing.</text>

  <g transform="translate(54 152)">
    <rect class="box" width="286" height="540"/>
    <text x="24" y="38" class="stage">1 · GUEST OWNERSHIP</text>
    <text x="24" y="76" class="heading">W5 + Memory Service</text>
    <rect x="24" y="105" width="238" height="88" class="chip"/>
    <text x="42" y="137" class="body">Object identity and version</text>
    <text x="42" y="164" class="mono">ObjectRef + MappingOwner</text>
    <rect x="24" y="215" width="238" height="112" class="memory"/>
    <text x="42" y="247" class="body">OBMM provider allocation</text>
    <text x="42" y="276" class="mono">mem_id · backing_offset</text>
    <text x="42" y="303" class="mono">base · len · access</text>
    <rect x="24" y="350" width="238" height="148" class="chip"/>
    <text x="42" y="382" class="body">Pin and strict PTO map</text>
    <text x="42" y="414" class="mono">map_id + generation</text>
    <text x="42" y="442" class="mono">ub_gm_addr</text>
    <text x="42" y="470" class="mono">opaque_mapping_ref</text>
    <text x="24" y="522" class="small">Lease begin/complete keeps every</text>
    <text x="24" y="544" class="small">view pinned through completion.</text>
  </g>

  <g transform="translate(385 152)">
    <rect class="box" width="286" height="540"/>
    <text x="24" y="38" class="stage">2 · VERSIONED MEMREF</text>
    <text x="24" y="76" class="heading">Guest UAPI descriptor</text>
    <rect x="24" y="106" width="238" height="240" class="dark"/>
    <text x="42" y="140" class="monoLight">opaque_mapping_ref</text>
    <text x="42" y="172" class="monoLight">ub_gm_addr</text>
    <text x="42" y="204" class="monoLight">byte_offset / length</text>
    <text x="42" y="236" class="monoLight">rank / dtype</text>
    <text x="42" y="268" class="monoLight">shape / strides</text>
    <text x="42" y="300" class="monoLight">READ or WRITE</text>
    <rect x="24" y="372" width="238" height="92" class="chip"/>
    <text x="42" y="405" class="body">Dispatch tag 10</text>
    <text x="42" y="435" class="mono">callable + fingerprint</text>
    <text x="24" y="510" class="small">The descriptor carries no model</text>
    <text x="24" y="532" class="small">payload through the control ring.</text>
  </g>

  <g transform="translate(716 152)">
    <rect class="box" width="332" height="540"/>
    <text x="24" y="38" class="stage">3 · AUTHORIZATION + EXECUTION</text>
    <text x="24" y="76" class="heading">QEMU + Simpler / PTO</text>
    <rect x="24" y="106" width="284" height="126" class="chip"/>
    <text x="42" y="139" class="body">QEMU binding authorization</text>
    <text x="42" y="168" class="mono">generation · bounds · access</text>
    <text x="42" y="197" class="mono">request-scoped aperture</text>
    <rect x="24" y="258" width="284" height="92" class="dark"/>
    <text x="42" y="291" class="monoLight">AddressSpace::UB_GM</text>
    <text x="42" y="322" class="monoLight">0x7000_0000_0000 aperture</text>
    <rect x="24" y="378" width="128" height="96" class="memory"/>
    <rect x="180" y="378" width="128" height="96" class="memory"/>
    <text x="49" y="417" class="heading">TLOAD</text>
    <text x="206" y="417" class="heading">TSTORE</text>
    <text x="48" y="447" class="small">read callback</text>
    <text x="204" y="447" class="small">write callback</text>
    <text x="24" y="510" class="small">Fence makes writable bindings</text>
    <text x="24" y="532" class="small">visible before object publication.</text>
  </g>

  <g transform="translate(1093 152)">
    <rect class="box" width="452" height="540"/>
    <text x="24" y="38" class="stage">4 · GLOBAL BACKING</text>
    <text x="24" y="76" class="heading">GSVA resolver + OBMM pool</text>
    <rect x="24" y="106" width="404" height="104" class="chip"/>
    <text x="42" y="138" class="body">Strict GSVA binding</text>
    <text x="42" y="167" class="mono">segment · home_va · epoch · token</text>
    <text x="42" y="191" class="small">Re-resolved on every read, write and fence.</text>

    <g transform="translate(24 244)">
      <rect width="404" height="190" class="memory"/>
      <text x="24" y="38" class="heading">Global OBMM shmem pool</text>
      <g transform="translate(24 66)">
        <rect width="78" height="86" fill="#1d5d57" rx="4"/>
        <rect x="14" y="14" width="50" height="10" fill="#a7d8d0"/>
        <rect x="14" y="34" width="50" height="10" fill="#a7d8d0"/>
        <rect x="14" y="54" width="50" height="10" fill="#a7d8d0"/>
      </g>
      <g transform="translate(126 66)">
        <rect width="78" height="86" fill="#1d5d57" rx="4"/>
        <rect x="14" y="14" width="50" height="10" fill="#a7d8d0"/>
        <rect x="14" y="34" width="50" height="10" fill="#a7d8d0"/>
        <rect x="14" y="54" width="50" height="10" fill="#a7d8d0"/>
      </g>
      <g transform="translate(228 66)">
        <rect width="78" height="86" fill="#1d5d57" rx="4"/>
        <rect x="14" y="14" width="50" height="10" fill="#a7d8d0"/>
        <rect x="14" y="34" width="50" height="10" fill="#a7d8d0"/>
        <rect x="14" y="54" width="50" height="10" fill="#a7d8d0"/>
      </g>
      <text x="326" y="91" class="mono">hidden</text>
      <text x="326" y="116" class="mono">KV</text>
      <text x="326" y="141" class="mono">output</text>
    </g>
    <text x="24" y="474" class="body">One backing, many authorized views</text>
    <text x="24" y="505" class="small">Object lifecycle remains owned by Memory Service.</text>
    <text x="24" y="528" class="small">GSVA identifies the global view used by QEMU.</text>
  </g>

  <path class="control" d="M340 202 C360 202 362 202 385 202"/>
  <path class="control" d="M671 202 C692 202 694 202 716 202"/>
  <path class="control" d="M1048 202 C1070 202 1072 202 1093 202"/>

  <path class="line" d="M340 610 C472 775 875 792 1093 520"/>
  <path class="line" d="M1048 578 C1070 578 1072 578 1093 578"/>
  <text x="500" y="785" class="body">Payload path: callbacks reach the managed OBMM bytes; control metadata stays on the UAPI path.</text>

  <g transform="translate(54 746)">
    <rect width="1492" height="104" fill="#ffffff" stroke="#c7d8d4" stroke-width="2" rx="8"/>
    <circle cx="34" cy="34" r="12" fill="#12756f"/>
    <text x="58" y="40" class="body">Guaranteed checks: request identity, mapping generation, bounds, access mode, lease lifetime and fence completion.</text>
    <circle cx="34" cy="73" r="12" fill="#b86a18"/>
    <text x="58" y="79" class="body">Current W5 callable 4 uses these callbacks in bulk around model execution; direct per-kernel TLOAD/TSTORE is a separate completion item.</text>
  </g>
</svg>
