<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1480"
     height="930"
     viewBox="0 0 1480 930"
     role="img"
     aria-labelledby="title desc">
  <title id="title">ub_sim 与 Lingqu DataSystem 的分工和连接关系</title>
  <desc id="desc">
    模型和 serving client 经 typed SDK 访问独立 mem_service 控制面。控制面通过
    provider contract 选择 OBMM、Block 或 DFS。OBMM 热数据路径进入 ub_sim 的
    guest、Linux UAPI 和 QEMU 模型；慢速普通远端 load 触发 P2B direct EL0 upcall，
    由 guest EL0 scheduler 切换和恢复协程。完整 PoC 仍需一条统一验收链覆盖全部环节。
  </desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3"
                    flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .canvas { fill: #f8fafc; }
      .title { fill: #0f172a; font: 700 30px -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .subtitle { fill: #475569; font: 400 16px -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .section-title { fill: #0f172a; font: 700 19px -apple-system,
        BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC",
        sans-serif; }
      .label { fill: #172033; font: 600 16px -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .body { fill: #334155; font: 400 14px -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .small { fill: #475569; font: 500 13px -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .arrow-label { fill: #334155; font: 600 13px -apple-system,
        BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC",
        sans-serif; }
      .card { stroke-width: 1.5; filter: url(#shadow); }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.2;
        marker-end: url(#arrow); }
      .arrow-accent { fill: none; stroke: #2563eb; stroke-width: 2.5;
        marker-end: url(#arrow-accent); }
      .dash { fill: none; stroke: #b91c1c; stroke-width: 2;
        stroke-dasharray: 8 7; }
      .gap-label { fill: #991b1b; font: 600 13px -apple-system,
        BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC",
        sans-serif; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1480" height="930"/>

  <text class="title" x="60" y="52">ub_sim 与 Lingqu DataSystem：分工和连接关系</text>
  <text class="subtitle" x="60" y="80">
    Lingqu 管理对象语义和放置；ub_sim 提供可观测、可注错的系统级数据面仿真
  </text>

  <!-- Workload layer -->
  <rect class="card" x="250" y="108" width="980" height="92" rx="14"
        fill="#eef2ff" stroke="#818cf8"/>
  <text class="section-title" x="740" y="140" text-anchor="middle">
    Workload / Client
  </text>
  <text class="label" x="740" y="170" text-anchor="middle">
    Qwen3 · DeepSeek · serving client · pretraining client
  </text>

  <path class="arrow-accent" d="M 740 200 L 740 246"/>
  <rect x="575" y="211" width="330" height="26" rx="13"
        fill="#dbeafe" stroke="#93c5fd"/>
  <text class="arrow-label" x="740" y="229" text-anchor="middle">
    typed SDK / versioned wire RPC
  </text>

  <!-- Lingqu control plane -->
  <rect class="card" x="120" y="252" width="1240" height="184" rx="16"
        fill="#ecfdf5" stroke="#34d399"/>
  <text class="section-title" x="152" y="286">Lingqu DataSystem 控制面</text>

  <rect x="155" y="310" width="330" height="94" rx="12"
        fill="#ffffff" stroke="#6ee7b7"/>
  <text class="label" x="320" y="340" text-anchor="middle">独立 mem_service daemon</text>
  <text class="body" x="320" y="366" text-anchor="middle">lifecycle · health · ready · audit</text>
  <text class="body" x="320" y="388" text-anchor="middle">snapshot / journal / restart</text>

  <rect x="575" y="310" width="330" height="94" rx="12"
        fill="#ffffff" stroke="#6ee7b7"/>
  <text class="label" x="740" y="340" text-anchor="middle">Object / Memory Service core</text>
  <text class="body" x="740" y="366" text-anchor="middle">identity · version · ownership</text>
  <text class="body" x="740" y="388" text-anchor="middle">placement · checksum · state</text>

  <rect x="995" y="310" width="330" height="94" rx="12"
        fill="#ffffff" stroke="#6ee7b7"/>
  <text class="label" x="1160" y="340" text-anchor="middle">Provider-neutral contract</text>
  <text class="body" x="1160" y="366" text-anchor="middle">registration · bounds · transfer</text>
  <text class="body" x="1160" y="388" text-anchor="middle">completion · checksum · fail-closed</text>

  <path class="arrow" d="M 485 357 L 565 357"/>
  <path class="arrow" d="M 905 357 L 985 357"/>

  <!-- Provider layer -->
  <path class="arrow" d="M 1160 404 L 1160 468 L 348 468 L 348 500"/>
  <path class="arrow" d="M 1160 404 L 1160 500"/>
  <path class="arrow" d="M 1160 404 L 1160 468 L 750 468 L 750 500"/>

  <text class="arrow-label" x="1180" y="456">placement / descriptor</text>

  <rect class="card" x="150" y="500" width="395" height="108" rx="14"
        fill="#eff6ff" stroke="#60a5fa"/>
  <text class="label" x="348" y="535" text-anchor="middle">OBMM provider</text>
  <text class="body" x="348" y="561" text-anchor="middle">hot remote payload · mapping descriptor</text>
  <text class="body" x="348" y="584" text-anchor="middle">SIM_DEC / GVA / GSVA</text>

  <rect class="card" x="575" y="500" width="350" height="108" rx="14"
        fill="#fff7ed" stroke="#fb923c"/>
  <text class="label" x="750" y="535" text-anchor="middle">Block provider</text>
  <text class="body" x="750" y="561" text-anchor="middle">durable payload bytes</text>
  <text class="body" x="750" y="584" text-anchor="middle">write · verify · quarantine</text>

  <rect class="card" x="955" y="500" width="350" height="108" rx="14"
        fill="#fdf4ff" stroke="#d946ef"/>
  <text class="label" x="1130" y="535" text-anchor="middle">DFS / Catalog</text>
  <text class="body" x="1130" y="561" text-anchor="middle">namespace · manifest · audit</text>
  <text class="body" x="1130" y="584" text-anchor="middle">restart-time resolution</text>

  <!-- ub_sim data plane -->
  <path class="arrow-accent" d="M 348 608 L 348 652"/>
  <rect class="card" x="75" y="658" width="825" height="214" rx="16"
        fill="#f1f5f9" stroke="#64748b"/>
  <text class="section-title" x="108" y="693">ub_sim 系统级数据面仿真</text>

  <rect x="108" y="716" width="224" height="70" rx="10"
        fill="#ffffff" stroke="#94a3b8"/>
  <text class="label" x="220" y="746" text-anchor="middle">Guest workload</text>
  <text class="body" x="220" y="770" text-anchor="middle">ordinary remote LDR</text>

  <rect x="374" y="716" width="224" height="70" rx="10"
        fill="#ffffff" stroke="#94a3b8"/>
  <text class="label" x="486" y="746" text-anchor="middle">Linux UAPI / driver</text>
  <text class="body" x="486" y="770" text-anchor="middle">mapping · event delivery</text>

  <rect x="640" y="716" width="224" height="70" rx="10"
        fill="#ffffff" stroke="#94a3b8"/>
  <text class="label" x="752" y="746" text-anchor="middle">QEMU UB / SIM_DEC</text>
  <text class="body" x="752" y="770" text-anchor="middle">latency · failure · completion</text>

  <path class="arrow" d="M 332 751 L 364 751"/>
  <path class="arrow" d="M 598 751 L 630 751"/>

  <path class="arrow-accent" d="M 752 786 L 752 823 L 220 823 L 220 801"/>
  <text class="arrow-label" x="486" y="816" text-anchor="middle">
    P2B direct EL0 upcall：pending / complete / fault
  </text>
  <text class="small" x="486" y="849" text-anchor="middle">
    guest EL0 scheduler 保存上下文、选择其他 coroutine，并在 completion 后恢复
  </text>

  <!-- Durable path -->
  <path class="arrow" d="M 750 608 L 750 630 L 1098 630 L 1098 662"/>
  <path class="arrow" d="M 1130 608 L 1130 652"/>
  <rect class="card" x="950" y="658" width="355" height="132" rx="14"
        fill="#fffbeb" stroke="#f59e0b"/>
  <text class="label" x="1128" y="695" text-anchor="middle">Durable recovery path</text>
  <text class="body" x="1128" y="723" text-anchor="middle">Block write + checksum</text>
  <text class="body" x="1128" y="747" text-anchor="middle">DFS manifest commit</text>
  <text class="body" x="1128" y="771" text-anchor="middle">daemon restart + ObjectRef resolve</text>

  <!-- Acceptance gap -->
  <path class="dash" d="M 1370 108 L 1410 108 L 1410 872 L 1370 872"/>
  <text class="gap-label" x="1390" y="490" text-anchor="middle"
        transform="rotate(90 1390 490)">
    待补：当前 revision、无旁路、覆盖全链路的统一 acceptance bundle
  </text>
</svg>
