<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Remote async load tokenless void-response 总体架构</title>
  <desc id="desc">展示 source UBC 作为唯一 CPU-facing void 发起方，并汇聚 source-local policy 与 remote wire VOID 两种 trigger。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#315f92"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#a43b3b"/>
    </marker>
    <style>
      .title{font:600 38px Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .sub{font:400 19px Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#46546a}
      .head{font:600 21px Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .body{font:400 16px Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#263247}
      .small{font:400 14px Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#46546a}
      .mono{font:500 15px "SFMono-Regular",Consolas,monospace;fill:#263247}
      .label{font:600 15px Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#315f92}
      .danger{font:600 14px Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#a43b3b}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f7f9fc"/>
  <text x="55" y="62" class="title">Remote async load：source UBC owns CPU-facing void delivery</text>
  <text x="55" y="96" class="sub">source-local policy 与 remote wire VOID 汇入同一 transaction 状态迁移和 precise Data Abort</text>

  <g>
    <rect x="55" y="145" width="210" height="150" rx="14" fill="#eaf1ff" stroke="#6f8fbe" stroke-width="2"/>
    <text x="80" y="182" class="head">Source Core</text>
    <text x="80" y="218" class="body">EL0 ordinary LDR</text>
    <text x="80" y="248" class="body">precise replay PC</text>
    <text x="80" y="277" class="small">Cacheable / Normal NC</text>

    <rect x="315" y="145" width="210" height="150" rx="14" fill="#e8f7f1" stroke="#4e927b" stroke-width="2"/>
    <text x="340" y="182" class="head">HA / Cache</text>
    <text x="340" y="218" class="body">Cacheable miss/fill</text>
    <text x="340" y="248" class="body">NC bypass</text>
    <text x="340" y="277" class="small">普通 coherence 资源</text>

    <rect x="575" y="125" width="285" height="190" rx="14" fill="#fff3dc" stroke="#c58a32" stroke-width="2"/>
    <text x="600" y="162" class="head">Source UBC</text>
    <text x="600" y="198" class="body">transaction record</text>
    <text x="600" y="228" class="mono">{peer_cna, req_id}</text>
    <text x="600" y="258" class="body">ACTIVE → VOIDED</text>
    <text x="600" y="288" class="small">唯一 CPU-facing void 发起方</text>

    <rect x="910" y="145" width="185" height="150" rx="14" fill="#eef2f7" stroke="#718096" stroke-width="2"/>
    <text x="950" y="182" class="head">UB Link</text>
    <text x="935" y="218" class="body">read request</text>
    <text x="935" y="248" class="body">void / real response</text>

    <rect x="1145" y="125" width="300" height="190" rx="14" fill="#f1edfa" stroke="#9178b3" stroke-width="2"/>
    <text x="1170" y="162" class="head">Destination UBC</text>
    <text x="1170" y="198" class="body">eligibility gate</text>
    <text x="1170" y="228" class="body">void-response predicate</text>
    <text x="1170" y="258" class="body">latency / jitter / fault</text>
    <text x="1170" y="288" class="small">remote read 继续执行</text>

    <rect x="1145" y="350" width="300" height="105" rx="14" fill="#e8f7f1" stroke="#4e927b" stroke-width="2"/>
    <text x="1170" y="390" class="head">Remote memory</text>
    <text x="1170" y="423" class="body">读取真实 data / status</text>
  </g>

  <path d="M265 220H315" fill="none" stroke="#315f92" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M525 220H575" fill="none" stroke="#315f92" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M860 220H910" fill="none" stroke="#315f92" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1095 220H1145" fill="none" stroke="#315f92" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1295 315V350" fill="none" stroke="#315f92" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="875" y="202" class="label">request</text>

  <rect x="55" y="505" width="710" height="405" rx="18" fill="#fff1ee" stroke="#c66a5d" stroke-width="2"/>
  <text x="85" y="548" class="head">VOID trigger → source UBC delivery</text>
  <text x="85" y="582" class="body">1. trigger：source-local policy 或 destination wire VOID</text>
  <text x="85" y="616" class="body">2. source UBC：ACTIVE → VOIDED；raise precise Data Abort</text>
  <text x="85" y="650" class="body">3. EL1 使用 current；保持 TASK_RUNNING；调用 schedule()</text>
  <text x="85" y="684" class="body">4. ERET 回原 PC；LDR 发出 fresh transaction</text>
  <text x="85" y="718" class="body">5. 旧 real completion 到达 source：drop payload + cleanup</text>
  <rect x="85" y="755" width="645" height="120" rx="12" fill="#ffffff" stroke="#d5a098"/>
  <text x="110" y="792" class="mono">software key = none</text>
  <text x="110" y="824" class="mono">CQ / IRQ / task sleep = none</text>
  <text x="110" y="856" class="mono">old payload → HA / PLT / core = forbidden</text>

  <rect x="835" y="505" width="710" height="405" rx="18" fill="#edf8f2" stroke="#5a987f" stroke-width="2"/>
  <text x="865" y="548" class="head">Predicate = REAL</text>
  <text x="865" y="582" class="body">1. destination 按 modeled delay 发送 real response</text>
  <text x="865" y="616" class="body">2. source 用 {peer_cna, req_id} 命中 transaction</text>
  <text x="865" y="650" class="body">3a. Cacheable：普通 HA/cache line fill</text>
  <text x="865" y="684" class="body">3b. Normal NC：scalar data 返回当前 LDR</text>
  <text x="865" y="718" class="body">4. load 正常退休，transaction record 回收</text>
  <rect x="865" y="755" width="645" height="120" rx="12" fill="#ffffff" stroke="#96c6b2"/>
  <text x="890" y="792" class="mono">Normal Cacheable → ordinary fill/replay</text>
  <text x="890" y="824" class="mono">Normal NC → direct scalar response</text>
  <text x="890" y="856" class="mono">policy off → always real</text>

  <path d="M1145 270C1050 342 940 342 860 280" fill="none" stroke="#a43b3b" stroke-width="4" marker-end="url(#arrow-red)"/>
  <text x="880" y="360" class="danger">wire VOID → source UBC</text>
  <path d="M718 315C700 390 555 440 410 505" fill="none" stroke="#a43b3b" stroke-width="4" marker-end="url(#arrow-red)"/>
  <text x="545" y="405" class="danger">local policy / received VOID → CPU-facing raise</text>
  <path d="M1295 455C1300 478 1280 490 1240 505" fill="none" stroke="#315f92" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
