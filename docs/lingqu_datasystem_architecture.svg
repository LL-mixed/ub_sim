<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Lingqu DataSystem 当前架构</title>
  <desc id="desc">展示工作负载通过统一 SDK 访问 Memory Service 和 Object Service，再由对象控制面选择 OBMM、Block、DFS 以及不同传输 provider 的分层关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .page { fill: #f8fafc; }
      .title { font: 700 31px Inter, "Noto Sans CJK SC", "PingFang SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Noto Sans CJK SC", "PingFang SC", sans-serif; fill: #475569; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .lane-title { font: 700 16px Inter, "Noto Sans CJK SC", "PingFang SC", sans-serif; fill: #334155; }
      .node { filter: url(#shadow); stroke-width: 1.5; }
      .node-title { font: 700 18px Inter, "Noto Sans CJK SC", "PingFang SC", sans-serif; fill: #0f172a; }
      .node-text { font: 400 14px Inter, "Noto Sans CJK SC", "PingFang SC", sans-serif; fill: #334155; }
      .node-small { font: 400 13px Inter, "Noto Sans CJK SC", "PingFang SC", sans-serif; fill: #475569; }
      .workload { fill: #eef2ff; stroke: #818cf8; }
      .semantic { fill: #ecfeff; stroke: #22a6b3; }
      .control { fill: #eff6ff; stroke: #3b82f6; }
      .hot { fill: #ecfdf5; stroke: #22c55e; }
      .durable { fill: #fff7ed; stroke: #f59e0b; }
      .catalog { fill: #fdf4ff; stroke: #c084fc; }
      .provider { fill: #f8fafc; stroke: #94a3b8; }
      .flow { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .flow-dash { fill: none; stroke: #64748b; stroke-width: 1.9; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .label { font: 600 12px Inter, "Noto Sans CJK SC", "PingFang SC", sans-serif; fill: #475569; }
      .note { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .note-text { font: 500 14px Inter, "Noto Sans CJK SC", "PingFang SC", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="page" width="1400" height="920"/>
  <text x="60" y="54" class="title">Lingqu DataSystem：从统一服务契约到可插拔数据平面</text>
  <text x="60" y="82" class="subtitle">应用只使用统一 SDK 与 ObjectRef；控制面管理对象语义，数据平面负责真实字节移动和持久化。</text>

  <rect x="48" y="110" width="1304" height="130" rx="16" class="lane"/>
  <text x="72" y="139" class="lane-title">使用方 / workload</text>
  <rect x="220" y="153" width="270" height="62" rx="10" class="node workload"/>
  <text x="355" y="179" text-anchor="middle" class="node-title">LLM Serving</text>
  <text x="355" y="201" text-anchor="middle" class="node-small">Qwen3 / DeepSeek / DS4</text>
  <rect x="565" y="153" width="270" height="62" rx="10" class="node workload"/>
  <text x="700" y="179" text-anchor="middle" class="node-title">Pretraining</text>
  <text x="700" y="201" text-anchor="middle" class="node-small">dataset / gradient / checkpoint</text>
  <rect x="910" y="153" width="270" height="62" rx="10" class="node workload"/>
  <text x="1045" y="179" text-anchor="middle" class="node-title">ub_sim / W5</text>
  <text x="1045" y="201" text-anchor="middle" class="node-small">QEMU 多节点验证与报告</text>

  <rect x="48" y="266" width="1304" height="152" rx="16" class="lane"/>
  <text x="72" y="295" class="lane-title">统一 API 与语义服务</text>
  <rect x="170" y="313" width="330" height="80" rx="10" class="node semantic"/>
  <text x="335" y="341" text-anchor="middle" class="node-title">Lingqu Memory Service</text>
  <text x="335" y="365" text-anchor="middle" class="node-text">检索、信任策略、semantic / execution memory</text>
  <text x="335" y="385" text-anchor="middle" class="node-small">shortpath support，不替 runtime 做最终决策</text>
  <rect x="535" y="313" width="330" height="80" rx="10" class="node semantic"/>
  <text x="700" y="341" text-anchor="middle" class="node-title">Prefix / KV / Artifact API</text>
  <text x="700" y="365" text-anchor="middle" class="node-text">runtime handoff、execution、training artifact</text>
  <text x="700" y="385" text-anchor="middle" class="node-small">稳定 wire contract 与 typed C client</text>
  <rect x="900" y="313" width="330" height="80" rx="10" class="node semantic"/>
  <text x="1065" y="341" text-anchor="middle" class="node-title">模型 Adapter</text>
  <text x="1065" y="365" text-anchor="middle" class="node-text">Qwen3 / DeepSeek geometry 与对象流</text>
  <text x="1065" y="385" text-anchor="middle" class="node-small">模型知识不进入 service core</text>

  <rect x="48" y="444" width="1304" height="130" rx="16" class="lane"/>
  <text x="72" y="473" class="lane-title">对象控制面</text>
  <rect x="258" y="489" width="884" height="62" rx="11" class="node control"/>
  <text x="700" y="515" text-anchor="middle" class="node-title">Object Service / mem_service core</text>
  <text x="700" y="539" text-anchor="middle" class="node-text">identity · version · placement · owner · checksum · lifecycle · readiness · audit</text>

  <rect x="48" y="600" width="1304" height="150" rx="16" class="lane"/>
  <text x="72" y="629" class="lane-title">存储与数据平面</text>
  <rect x="150" y="647" width="330" height="78" rx="10" class="node hot"/>
  <text x="315" y="675" text-anchor="middle" class="node-title">OBMM / GVA / GSVA</text>
  <text x="315" y="699" text-anchor="middle" class="node-text">热 tensor、KV、hidden、跨节点可见性</text>
  <text x="315" y="718" text-anchor="middle" class="node-small">segment / token / MESI / fence</text>
  <rect x="535" y="647" width="330" height="78" rx="10" class="node durable"/>
  <text x="700" y="675" text-anchor="middle" class="node-title">Lingqu Block / UB SSD</text>
  <text x="700" y="699" text-anchor="middle" class="node-text">持久 payload、sealed block、checksum</text>
  <text x="700" y="718" text-anchor="middle" class="node-small">大对象、checkpoint、冷 KV</text>
  <rect x="920" y="647" width="330" height="78" rx="10" class="node catalog"/>
  <text x="1085" y="675" text-anchor="middle" class="node-title">Lingqu DFS</text>
  <text x="1085" y="699" text-anchor="middle" class="node-text">catalog、manifest、namespace、audit log</text>
  <text x="1085" y="718" text-anchor="middle" class="node-small">可重建索引，不承担热数据搬运</text>

  <rect x="48" y="776" width="1304" height="92" rx="16" class="lane"/>
  <text x="72" y="805" class="lane-title">Transport provider（显式选择，禁止自动回退）</text>
  <rect x="250" y="815" width="200" height="34" rx="8" class="provider"/>
  <text x="350" y="837" text-anchor="middle" class="node-text">UB / URMA / shmem</text>
  <rect x="495" y="815" width="180" height="34" rx="8" class="provider"/>
  <text x="585" y="837" text-anchor="middle" class="node-text">RoCE full mesh</text>
  <rect x="720" y="815" width="180" height="34" rx="8" class="provider"/>
  <text x="810" y="837" text-anchor="middle" class="node-text">TCP</text>
  <rect x="945" y="815" width="200" height="34" rx="8" class="provider"/>
  <text x="1045" y="837" text-anchor="middle" class="node-text">local / loopback</text>

  <path d="M355,215 V270 H335 V305" class="flow"/>
  <path d="M700,215 V305" class="flow"/>
  <path d="M1045,215 V305" class="flow"/>
  <path d="M335,393 V420 H570 V481" class="flow-blue"/>
  <path d="M700,393 V481" class="flow-blue"/>
  <path d="M1065,393 V420 H830 V481" class="flow-blue"/>
  <path d="M700,551 V584 H315 V639" class="flow"/>
  <path d="M700,551 V639" class="flow"/>
  <path d="M700,551 V584 H1085 V639" class="flow"/>
  <path d="M315,725 V767 H350 V807" class="flow-dash"/>
  <path d="M700,725 V767 H585 V807" class="flow-dash"/>
  <path d="M700,725 V767 H810 V807" class="flow-dash"/>
  <path d="M1085,725 V767 H1045 V807" class="flow-dash"/>

  <rect x="104" y="884" width="1192" height="24" rx="6" class="note"/>
  <text x="700" y="901" text-anchor="middle" class="note-text">核心不感知设备和模型；provider 不决定对象语义；任何无法证明完整性的路径都 fail-closed。</text>
</svg>
